<script>
'use strict';

// Direct PostgREST access; no external JS packages or sign-in dialog.

const API_ROOT=DB_URL+'/rest/v1/';
async function apiRequest(path,{method='GET',params=null,body=null,headers={}}={}){
  const url=path.startsWith('http')?path:API_ROOT+path+(params?'?'+params.toString():'');
  let response;
  try{
    response=await fetch(url,{
      method,
      headers:{apikey:DB_KEY,...(body!==null&&!(body instanceof Blob)?{'Content-Type':'application/json'}:{}),...headers},
      body:body===null?undefined:body instanceof Blob?body:JSON.stringify(body),
      cache:'no-store',mode:'cors'
    });
  }catch(e){throw Error('اتصال اینترنت یا دسترسی به Supabase برقرار نیست. '+e.message);}
  const raw=await response.text();
  let json=null;
  try{json=raw?JSON.parse(raw):null;}catch{json=raw;}
  if(!response.ok){const msg=(json&&typeof json==='object'&&(json.message||json.error||json.msg))||raw||response.statusText;
    throw Error('کد '+response.status+' — '+msg);}
  return json;
}
class TableQuery{
  constructor(table){this.table=table;this.method='GET';this.params=new URLSearchParams();this.body=null;}
  select(fields){this.params.set('select',fields);return this;}
  order(col,{ascending=false}={}){this.params.set('order',col+'.'+(ascending?'asc':'desc'));return this;}
  limit(n){this.params.set('limit',String(n));return this;}
  eq(col,val){this.params.set(col,'eq.'+val);return this;}
  in(col,vals){this.params.set(col,'in.('+vals.join(',')+')');return this;}
  insert(payload){this.method='POST';this.body=payload;return this;}
  update(payload){this.method='PATCH';this.body=payload;return this;}
  async execute(){try{const data=await apiRequest(this.table,{method:this.method,params:this.params,body:this.body,headers:this.method==='GET'?{}:{Prefer:'return=minimal'}});return {data:data||[],error:null};}catch(error){return {data:null,error};}}
  then(ok,bad){return this.execute().then(ok,bad);}
}
const client={
  from(table){return new TableQuery(table);},
  storage:{from(bucket){return {
    getPublicUrl(path){return {data:{publicUrl:DB_URL+'/storage/v1/object/public/'+encodeURIComponent(bucket)+'/'+path.split('/').map(encodeURIComponent).join('/')}};},
    async upload(path,file){try{
      const url=DB_URL+'/storage/v1/object/'+encodeURIComponent(bucket)+'/'+path.split('/').map(encodeURIComponent).join('/');
      const data=await apiRequest(url,{method:'POST',body:file,headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'}});
      return {data,error:null};
    }catch(error){return {data:null,error};}}
  };}}
};
const DEPTS=['میلیتاریسم','تاریخ','جامعه‌شناسی','اقتصاد','فلسفه','فرهنگ','حقوق','مطالبات ملی'];
const el=document.getElementById('app');
const state={me:null,view:'home',kind:'directive',to:null,from:null,forward:null,notice:'',err:false,rows:[],projects:[],loading:false,filters:{kind:'all',dept:'all',search:''},projectStatus:'',timer:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toEn=v=>String(v??'').replace(/[۰-۹]/g,x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x)).replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x));
const stamp=v=>v?new Date(v).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'}):'—';
const b=i=>3+i*12;
function who(code){code=Number(code);if(code===1)return {code,role:'president',dept:null,title:'رئیس پژوهشکده'};if(code===2)return {code,role:'pr',dept:null,title:'مدیریت روابط عمومی'};if(!Number.isInteger(code)||code<3||code>98)return null;const idx=Math.floor((code-3)/12),p=(code-3)%12;return {code,role:p===0?'secretary':p===1?'deputy':'member',idx,dept:DEPTS[idx],title:p===0?(idx===0?'SS GELB':`دبیر ${DEPTS[idx]}`):p===1?(idx===0?'ارشیا':`معاون ${DEPTS[idx]}`):`عضو ${p-1} ${DEPTS[idx]}`};}
const person=c=>who(c)?.title||`کد ${c}`;
function inform(t,err=false){state.notice=t;state.err=err;}
function notice(){return state.notice?`<div class="notice ${state.err?'bad':''}" role="status">${esc(state.notice)}</div>`:'';}
function theme(){document.body.className=state.me?.role==='pr'?'rose':state.me?.role==='president'?'gold':'';el.className='app'+(state.me?.role==='pr'||state.me?.role==='president'?' wide':'');}
function button(title,detail,action,attrs=''){return `<button class="tile" data-do="${action}" ${attrs}><span><b>${esc(title)}</b>${detail?`<small>${esc(detail)}</small>`:''}</span><span class="chevron">‹</span></button>`;}
function header(){const a=state.me;const title=a.role==='pr'?'مدیریت روابط عمومی':a.role==='president'?'ریاست پژوهشکده':a.dept;return `<header class="toolbar"><div><h1>${esc(title)}</h1><p>${esc(a.title)} · کد ${a.code}</p></div><div class="tools"><button class="tiny" data-do="refresh">↻</button><button class="tiny" data-do="logout">خروج</button></div></header>`;}
const back=()=>'<button class="tiny back" data-do="home">بازگشت</button>';
function loginPage(){return `<section class="login"><div class="eyebrow">پژوهشکده</div><h1>سامانه جامع دبیران</h1><p class="desc">کد واحد خود را وارد کنید.</p><p class="online">اتصال مستقیم به صندوق آنلاین · نسخه ۵</p><form id="codeForm"><div class="field"><input class="input code-input" name="code" type="text" inputmode="numeric" maxlength="3" autocomplete="off" required placeholder="کد واحد" autofocus></div><button type="submit" class="btn full">ورود</button></form>${notice()}</section>`;}
function homePage(){const a=state.me;let h=header()+notice();if(a.role==='president'){
 h+=`<div class="summary"><div class="metric"><b>${state.rows.length}</b><small>ابلاغ و گزارش</small></div><div class="metric"><b>${state.projects.length}</b><small>پروژه‌ها</small></div><div class="metric"><b>۹۸</b><small>جایگاه سازمانی</small></div></div><div class="tiles grid">`+
 button('تمام ابلاغیه‌ها','مشاهده همه گروه‌ها و اعضا','messages','data-kind="directive"')+
 button('تمام گزارش‌ها','مشاهده همه صندوق‌ها','messages','data-kind="report"')+
 button('تمام مکاتبات','جست‌وجوی همه پیام‌ها','messages','data-kind="all"')+
 button('پروژه‌های پژوهشکده','فهرست، وضعیت و مسئولان','projects')+
 button('ابلاغ جدید','به هر یک از ۹۷ جایگاه','compose','data-kind="directive" data-to="everyone"')+
 button('تعریف پروژه','واگذاری پروژه به هر عضو','newProject')+
 button('فهرست واحدها','مشاهده نام و کد ۹۸ جایگاه','units')+`</div>`;
 }else if(a.role==='pr'){
 h+=`<div class="tiles">`+button('ابلاغیه‌های رئیس','','inbox','data-kind="directive" data-from="1"')+button('گزارش به رئیس','','compose','data-kind="report" data-to="1"')+`</div><p class="section">دبیرخانه‌ها</p><div class="group-list">`;
 DEPTS.forEach((dep,i)=>{const c=b(i);h+=`<div class="group"><div class="group-name">${esc(dep)}</div><div class="pair"><button data-do="compose" data-kind="directive" data-to="${c}">ابلاغ به دبیر</button><button data-do="inbox" data-kind="report" data-from="${c}">گزارش‌های دبیر</button></div></div>`;});h+=`</div>`;
 }else{
 const code=b(a.idx);const tiles=a.role==='secretary'?[['ابلاغیه‌های روابط عمومی','inbox','directive','all'],['گزارش به روابط عمومی','compose','report','2'],['ابلاغ به معاون','compose','directive',String(code+1)],['گزارش‌های معاون و اعضا','inbox','report','deputy+members']]:a.role==='deputy'?[['ابلاغیه‌های دبیر','inbox','directive','all'],['گزارش به دبیر','compose','report',String(code)],['ابلاغ به اعضا','compose','directive','members'],['گزارش اعضا','inbox','report','members']]:[['ابلاغیه‌ها','inbox','directive','all'],['نوشتن گزارش','compose','report',String(code+1)]];
 h+=`<div class="tiles">`+tiles.map(([text,action,kind,target])=>button(text,'',action,action==='inbox'?`data-kind="${kind}" data-from="${target}"`:`data-kind="${kind}" data-to="${target}"`)).join('')+`</div>`;
 }return h+'<p class="footer">سامانه جامع دبیران · صندوق آنلاین · v5</p>';}
function inboxList(){const a=state.me,kind=state.kind,depBase=a.idx===undefined?null:b(a.idx);let all=state.rows.filter(m=>m.kind===kind&&(m.receiver_code===a.code||(a.role==='secretary'&&kind==='report'&&m.receiver_code===depBase+1)));if(state.from==='all'){} else if(state.from==='deputy')all=all.filter(m=>m.sender_code===depBase+1);else if(state.from==='members')all=all.filter(m=>m.sender_code>=depBase+2&&m.sender_code<=depBase+11);else if(state.from==='deputy+members')all=all.filter(m=>m.sender_code>=depBase+1&&m.sender_code<=depBase+11);else if(state.from && /^\d+$/.test(state.from))all=all.filter(m=>m.sender_code===Number(state.from));return inboxCards(all,kind==='report'?'گزارش‌ها':'ابلاغیه‌ها');}
function inboxCards(list,title){let h=header()+back()+`<h2>${esc(title)} <span class="meta">(${list.length})</span></h2>`+notice();if(!list.length)return h+'<div class="empty">صندوق خالی است.</div>';for(const m of list){const links=(m.links||[]).map(u=>link(u,esc(u))).join('');const attachments=(m.attachments||[]).map((u,i)=>link(u,`پیوست ${i+1}`,'file-link')).join('');h+=`<article class="card"><div class="card-head"><h3>${esc(m.title||'بدون عنوان')}</h3><span class="badge">${m.read_at?'خوانده شده':'جدید'}</span></div><div class="meta">از ${esc(person(m.sender_code))} · به ${esc(person(m.receiver_code))} · ${stamp(m.created_at)}</div><p>${esc(m.body)}</p><div class="links">${links}${attachments}</div><div class="actions">${!m.read_at&&m.receiver_code===state.me.code?`<button class="btn secondary" data-do="read" data-id="${m.id}">تأیید دریافت</button>`:''}${m.kind==='report'&&m.receiver_code===state.me.code&&['deputy','secretary','pr'].includes(state.me.role)?`<button class="btn secondary" data-do="forward" data-id="${m.id}">${state.me.role==='pr'?'ارسال به رئیس':'ارسال به مسئول بالاتر'}</button>`:''}</div></article>`;}return h;}
function link(url,label,cls=''){try{if(url.startsWith('sb://')){const path=url.slice(5);const {data}=client.storage.from('dabiran_attachments').getPublicUrl(path);url=data.publicUrl;}const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return '';return `<a class="${cls}" href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;}catch{return '';}}
function allMessagesPage(){let filtered=state.rows;if(state.kind!=='all')filtered=filtered.filter(m=>m.kind===state.kind);if(state.filters.dept!=='all'){const i=Number(state.filters.dept),low=b(i),high=low+11;filtered=filtered.filter(m=>[m.sender_code,m.receiver_code].some(c=>c>=low&&c<=high));}const q=state.filters.search.trim().toLowerCase();if(q)filtered=filtered.filter(m=>[m.title,m.body,m.sender_code,m.receiver_code].some(v=>String(v??'').toLowerCase().includes(q)));return header()+back()+`<h2>${state.kind==='directive'?'تمام ابلاغیه‌ها':state.kind==='report'?'تمام گزارش‌ها':'تمام مکاتبات'}</h2>`+`<div class="filters"><select class="input" id="deptFilter"><option value="all">تمام دبیرخانه‌ها</option>${DEPTS.map((d,i)=>`<option value="${i}" ${state.filters.dept===String(i)?'selected':''}>${esc(d)}</option>`).join('')}</select><input id="textFilter" class="input" placeholder="نام، متن یا کد واحد" value="${esc(state.filters.search)}"></div>`+notice()+inboxCardsBody(filtered);}
function inboxCardsBody(items){if(!items.length)return '<div class="empty">موردی پیدا نشد.</div>';return items.map(m=>`<article class="card"><div class="card-head"><h3>${esc(m.title)}</h3><span class="badge">${m.kind==='report'?'گزارش':'ابلاغیه'}</span></div><div class="meta">${esc(person(m.sender_code))} ← ${esc(person(m.receiver_code))} · ${stamp(m.created_at)}</div><p>${esc(m.body)}</p><div class="links">${(m.links||[]).map(u=>link(u,esc(u))).join('')}${(m.attachments||[]).map((u,i)=>link(u,'پیوست '+(i+1),'file-link')).join('')}</div></article>`).join('');}
function options(from,to){let s='';for(let code=from;code<=to;code++){const info=who(code);s+=`<option value="${code}">${esc(info.title)} · ${code}</option>`;}return s;}
function formPage(){const a=state.me,isDirective=state.kind==='directive',title=isDirective?'ابلاغ جدید':'نوشتن گزارش';let to=state.to,select='';if(to==='everyone')select=`<select class="input" name="receiver" required>${options(2,98)}</select>`;else if(to==='members')select=`<select class="input" name="receiver" required>${options(b(a.idx)+2,b(a.idx)+11)}</select>`;else select=`<div class="input" style="min-height:46px">${esc(person(Number(to)))}</div>`;
 const m=state.forward;return header()+back()+`<h2>${title}</h2>`+notice()+`<form id="sendForm" class="compose"><div class="field"><label>گیرنده</label>${select}</div><div class="field"><label>عنوان</label><input class="input" name="title" required placeholder="عنوان" value="${esc(m?'ارجاع گزارش: '+m.title:'')}"></div><div class="field"><label>متن</label><textarea class="input" name="body" required placeholder="متن ابلاغیه یا گزارش...">${esc(m?`گزارش ${person(m.sender_code)}:\n\n${m.body}`:'')}</textarea></div><div class="field"><label>لینک‌ها (هر لینک یک سطر)</label><textarea class="input smallarea" name="links" placeholder="https://t.me/...">${esc((m?.links||[]).join('\n'))}</textarea></div><div class="field"><label>عکس یا فایل (اختیاری)</label><input class="input" type="file" name="files" multiple><div class="help">حداکثر ۲۵ مگابایت برای هر فایل، در محدوده ظرفیت رایگان سرویس.</div></div><button class="btn full" type="submit">${isDirective?'ارسال ابلاغیه':'ارسال گزارش'}</button></form>`;}
function unitsPage(){return header()+back()+'<h2>تمام واحدهای پژوهشکده</h2>'+`<div class="group-list">${Array.from({length:98},(_,i)=>{const x=who(i+1);return `<div class="group"><div class="group-name">${esc(x.title)} · کد ${x.code}</div>${x.dept?`<span class="meta">${esc(x.dept)}</span>`:''}</div>`;}).join('')}</div>`;}
function projectsPage(){let items=state.projects;return header()+back()+`<h2>تمام پروژه‌های پژوهشکده</h2>`+notice()+`<button class="btn secondary" data-do="newProject" style="margin-bottom:14px">+ پروژه جدید</button>`+(items.length?items.map(p=>`<article class="card"><h3>${esc(p.title)}</h3><div class="meta">مسئول: ${esc(person(p.assigned_to))} · گروه: ${esc(p.department)}${p.due_date?' · مهلت: '+esc(p.due_date):''}</div><p>${esc(p.description)}</p><div class="inline"><select class="status-select" data-project="${p.id}">${['ابلاغ شده','در حال انجام','تکمیل شده','متوقف شده'].map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select><button class="tiny" data-do="saveProject" data-id="${p.id}">ذخیره وضعیت</button></div></article>`).join(''):'<div class="empty">هنوز پروژه‌ای ثبت نشده است.</div>');}
function projectForm(){return header()+back()+`<h2>ثبت پروژه جدید</h2>`+notice()+`<form id="projectForm" class="compose"><div class="field"><label>عنوان پروژه</label><input class="input" name="title" required></div><div class="field"><label>مسئول</label><select class="input" name="assignee">${options(2,98)}</select></div><div class="field"><label>شرح پروژه</label><textarea class="input" name="description" placeholder="چه کاری باید انجام شود؟" required></textarea></div><div class="field"><label>مهلت (اختیاری)</label><input class="input" type="date" name="due"></div><button class="btn full">ثبت و ابلاغ پروژه</button></form>`;}
function draw(){theme();el.innerHTML=!state.me?loginPage():state.view==='home'?homePage():state.view==='inbox'?inboxList():state.view==='messages'?allMessagesPage():state.view==='compose'?formPage():state.view==='projects'?projectsPage():state.view==='units'?unitsPage():projectForm();}
async function queryMessages(){let q=client.from('messages').select('id,sender_code,receiver_code,kind,title,body,links,attachments,created_at,read_at').order('created_at',{ascending:false}).limit(1500);if(state.me.role==='secretary')q=q.in('receiver_code',[state.me.code,b(state.me.idx)+1]);else if(state.me.role!=='president')q=q.eq('receiver_code',state.me.code);const {data,error}=await q;if(error)throw error;state.rows=data||[];}
async function queryProjects(){if(state.me.role!=='president')return;const {data,error}=await client.from('projects').select('*').order('created_at',{ascending:false}).limit(1500);if(error)throw error;state.projects=data||[];}
async function refresh(showToast=false){await queryMessages();await queryProjects();if(showToast)inform('صندوق‌ها به‌روز شدند.');draw();}
async function enter(code){if(state.loading)return;const a=who(code);if(!a){inform('کد باید بین ۱ تا ۹۸ باشد.',true);draw();return;}state.me=a;state.view='home';inform('');try{await refresh();clearInterval(state.timer);state.timer=setInterval(async()=>{if(state.me&&!document.hidden&&!state.loading)try{await queryMessages();if(state.me.role==='president')await queryProjects();if(state.view==='inbox'||state.view==='messages'||state.view==='home')draw();}catch(e){inform('ارتباط قطع شد: '+e.message,true);draw();}},8000);}catch(e){inform('ارتباط آنلاین برقرار نشد. ابتدا SQL جدید را در Supabase اجرا کن. جزئیات: '+e.message,true);draw();}}
function exit(){clearInterval(state.timer);state.me=null;state.view='home';state.rows=[];state.projects=[];state.from=null;state.to=null;state.forward=null;inform('');draw();}
async function uploadFiles(files){const paths=[];for(const f of files){if(f.size>26214400)throw Error('هر فایل باید کمتر از ۲۵ مگابایت باشد.');let ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);const path=`unit-${state.me.code}/${crypto.randomUUID()}.${ext||'bin'}`;const {error}=await client.storage.from('dabiran_attachments').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(error)throw Error('آپلود فایل ناموفق: '+error.message);paths.push('sb://'+path);}return paths;}
async function sendMessage(f){if(state.loading)return;const to=['everyone','members'].includes(state.to)?Number(f.elements.receiver.value):Number(state.to);const title=f.elements.title.value.trim(),body=f.elements.body.value.trim();const links=f.elements.links.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(const url of links){try{if(!['http:','https:'].includes(new URL(url).protocol))throw 0;}catch{inform('لینک باید با https:// شروع شود.',true);draw();return;}}const btn=f.querySelector('button[type="submit"]');state.loading=true;btn.disabled=true;btn.textContent='در حال ارسال...';try{const attach=[...(state.forward?.attachments||[]),...await uploadFiles(Array.from(f.elements.files.files||[]))];const {error}=await client.from('messages').insert({sender_code:state.me.code,receiver_code:to,kind:state.kind,title,body,links,attachments:attach});if(error)throw error;state.view='home';state.forward=null;inform('پیام در صندوق آنلاین گیرنده ثبت شد.');await refresh();}catch(e){inform('ارسال نشد: '+e.message,true);const n=document.createElement('div');n.className='notice bad';n.textContent=state.notice;f.prepend(n);}finally{state.loading=false;btn.disabled=false;btn.textContent=state.kind==='directive'?'ارسال ابلاغیه':'ارسال گزارش';}}
async function createProject(f){if(state.loading)return;state.loading=true;const btn=f.querySelector('button[type="submit"],button.btn');btn.disabled=true;btn.textContent='در حال ثبت...';try{const target=Number(f.elements.assignee.value),title=f.elements.title.value.trim(),description=f.elements.description.value.trim();const targetInfo=who(target);const {error}=await client.from('projects').insert({title,description,created_by:state.me.code,assigned_to:target,department:targetInfo.dept||'مرکزی',due_date:f.elements.due.value||null});if(error)throw error;const {error:messageError}=await client.from('messages').insert({sender_code:state.me.code,receiver_code:target,kind:'directive',title:'پروژه: '+title,body:description,links:[],attachments:[]});if(messageError)throw Error('پروژه ثبت شد اما ابلاغ آن انجام نشد: '+messageError.message);state.view='projects';inform('پروژه ثبت شد و ابلاغیه به مسئول آن ارسال شد.');await refresh();}catch(e){inform(e.message,true);const n=document.createElement('div');n.className='notice bad';n.textContent=state.notice;f.prepend(n);}finally{state.loading=false;btn.disabled=false;btn.textContent='ثبت و ابلاغ پروژه';}}
el.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='codeForm'){const raw=toEn(f.elements.code.value).trim();if(/^\d{1,3}$/.test(raw))enter(Number(raw));else{inform('کد واحد نامعتبر است.',true);draw();}}else if(f.id==='sendForm')sendMessage(f);else if(f.id==='projectForm')createProject(f);});
el.addEventListener('click',async e=>{const t=e.target.closest('[data-do]');if(!t||state.loading)return;const action=t.dataset.do;try{if(action==='logout'){exit();return;}if(action==='home'){state.view='home';state.forward=null;inform('');draw();return;}if(action==='refresh'){await refresh(true);return;}if(action==='inbox'){state.view='inbox';state.kind=t.dataset.kind;state.from=t.dataset.from;inform('');await refresh();return;}if(action==='messages'){state.view='messages';state.kind=t.dataset.kind;state.filters={dept:'all',search:''};inform('');await refresh();return;}if(action==='compose'){state.view='compose';state.kind=t.dataset.kind;state.to=t.dataset.to;state.forward=null;inform('');draw();return;}if(action==='projects'){state.view='projects';inform('');await refresh();return;}if(action==='units'){state.view='units';inform('');draw();return;}if(action==='newProject'){state.view='newProject';inform('');draw();return;}if(action==='forward'){const m=state.rows.find(x=>x.id===Number(t.dataset.id));if(!m)return;state.forward=m;state.kind='report';state.to=state.me.role==='deputy'?String(b(state.me.idx)):state.me.role==='secretary'?'2':state.me.role==='pr'?'1':null;state.view='compose';inform('');draw();return;}if(action==='read'){const {error}=await client.from('messages').update({read_at:new Date().toISOString()}).eq('id',Number(t.dataset.id)).eq('receiver_code',state.me.code);if(error)throw error;inform('دریافت پیام ثبت شد.');await refresh();return;}if(action==='saveProject'){const s=el.querySelector(`[data-project="${t.dataset.id}"]`);const {error}=await client.from('projects').update({status:s.value}).eq('id',Number(t.dataset.id));if(error)throw error;inform('وضعیت پروژه ذخیره شد.');await refresh();return;}}catch(err){inform('خطا: '+err.message,true);draw();}});
el.addEventListener('change',e=>{if(e.target.id==='deptFilter'){state.filters.dept=e.target.value;draw();}});
el.addEventListener('input',e=>{if(e.target.id==='textFilter'){const pos=e.target.selectionStart;state.filters.search=e.target.value;const list=el.querySelectorAll('.card,.empty');const arr=state.rows.filter(m=>state.kind==='all'||m.kind===state.kind).filter(m=>state.filters.dept==='all'||[m.sender_code,m.receiver_code].some(c=>c>=b(Number(state.filters.dept))&&c<=b(Number(state.filters.dept))+11)).filter(m=>[m.title,m.body,m.sender_code,m.receiver_code].some(v=>String(v??'').toLowerCase().includes(state.filters.search.toLowerCase())));const grid=list.length?list[0].parentNode:null;const parts=el.querySelector('.filters');if(parts){let node=parts.nextElementSibling;if(node?.classList?.contains('notice'))node=node.nextElementSibling;while(node){const next=node.nextElementSibling;node.remove();node=next;}parts.insertAdjacentHTML('afterend',inboxCardsBody(arr));}e.target.focus();e.target.setSelectionRange(pos,pos);}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.me&&!state.loading)refresh().catch(e=>{inform('خطای اتصال: '+e.message,true);draw();});});
// Remove older PWA worker which could display outdated app code.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>{if(r.scope.includes('/DABIRAN_X1/')||r.scope.startsWith(location.origin+location.pathname.replace(/[^/]+$/,'')))r.unregister();})).catch(()=>{});}
if('caches' in window){caches.keys().then(keys=>keys.filter(k=>k.startsWith('dabiran-pwa-')).forEach(k=>caches.delete(k))).catch(()=>{});}
draw();
</script>
</body>
</html>
