<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>دبیرخانه میلیتاریسم</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#08090b;--panel:#121417;--line:#282b30;--ink:#f4f5f7;--muted:#9da2aa;--accent:#e4cf9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.shell{width:min(100%,550px);margin:auto;min-height:100dvh;padding:30px 20px 96px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:.03em}.title{font-size:22px;font-weight:800;line-height:1.65;margin:3px 0}.sub{color:var(--muted);font-size:13px}.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:9px 12px}.login{min-height:90dvh;display:flex;flex-direction:column;justify-content:center}.login h1{font-size:26px;line-height:1.5;margin:10px 0 4px}.login .hint{color:var(--muted);font-size:14px;margin:0 0 27px}label{display:block;margin:0 0 9px;font-weight:600;font-size:13px}.input{width:100%;border:1px solid #383b40;background:#16181c;color:var(--ink);border-radius:14px;padding:15px 16px;outline:none}.input:focus{border-color:var(--accent)}.code{direction:ltr;text-align:center;font-weight:800;font-size:27px;letter-spacing:9px}.primary{background:var(--accent);color:#101010;border:0;border-radius:14px;min-height:52px;padding:12px 16px;font-weight:800;width:100%}.primary:active,.tile:active{transform:scale(.99)}.alert{padding:13px;border:1px solid #733a3a;background:#321818;color:#ffd4d4;border-radius:12px;font-size:13px;margin-top:12px}.note{color:#777d86;font-size:12px;line-height:1.9;margin-top:20px}.stack{display:grid;gap:11px}.tile{text-align:right;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:78px}.tile strong{font-size:17px;font-weight:700}.tile small{display:block;margin-top:3px;color:var(--muted);font-size:12px}.chev{font-size:23px;color:var(--accent)}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:12px 0 21px}.sectionHead h2{font-size:19px;margin:0}.back{background:none;border:none;color:var(--accent);padding:7px 0}.item{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:17px;margin-bottom:11px}.item h3{font-size:15px;margin:0 0 8px}.item p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;color:#d1d3d7;font-size:14px;margin:0 0 9px}.meta{font-size:12px;color:var(--muted);margin-top:10px}.empty{border:1px dashed #34373b;border-radius:15px;padding:32px 20px;color:var(--muted);text-align:center;font-size:14px}.field{margin-bottom:18px}.field textarea{min-height:160px;resize:vertical;line-height:1.9}.input[type=file]{padding:12px;font-size:12px}.status{margin-top:13px;font-size:13px;color:#9cdaa8}.count{background:#29251b;color:var(--accent);padding:2px 9px;border-radius:20px;font-size:12px}.link{color:var(--accent);overflow-wrap:anywhere;font-size:13px}.attachment{display:inline-block;margin:5px 5px 0 0;text-decoration:none;color:#eee;background:#23252a;padding:6px 10px;border-radius:8px;font-size:12px}.smallbutton{border:1px solid var(--line);background:#202328;color:var(--ink);border-radius:10px;padding:9px 12px;margin-top:10px}.tag{color:var(--accent);font-size:12px}.foot{margin-top:32px;text-align:center;color:#60646c;font-size:11px}hr{border:0;border-top:1px solid var(--line);margin:14px 0}@media(min-width:740px){.shell{padding-top:65px}.login{min-height:80vh}}@media(prefers-reduced-motion:no-preference){.tile,.primary{transition:transform .13s,background .13s}.tile:hover{background:#1c1e22}} </style></head><body><main id="app" class="shell"></main><script>
(()=>{'use strict';const app=document.getElementById('app');const KEY='militarism_min_v2';const ROLE={1:{name:'دبیر',person:'SS GELB'},2:{name:'معاون',person:'ارشیا'},3:{name:'عضو',person:'عضو دبیرخانه'}};let role=null,view='home',message='',files=[];const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{notices:[],reports:[]}}catch{return{notices:[],reports:[]}}};let db=read();db.notices??=[];db.reports??=[];const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{message='فضای ذخیره‌سازی مرورگر کافی نیست. فایل‌های حجیم را با لینک ارسال کنید.';return false}};const route=({from,to,type})=>({from,to,type});const noticeAudience=r=>r===1?'1':r===2?'2':'3';const configs={1:[['notices','ابلاغیه‌های روابط عمومی','دستورهای دریافت‌شده'],['report','گزارش به روابط عمومی','ثبت و ارسال گزارش'],['send','ابلاغ به معاون','ارسال دستور برای ارشیا'],['reports','گزارش‌های معاون و اعضا','مشاهده گزارش‌های دریافتی']],2:[['notices','ابلاغیه‌های دبیر','دستورهای دریافت‌شده'],['report','گزارش به دبیر','ثبت و ارسال گزارش'],['send','ابلاغ به اعضا','ارسال دستور برای اعضا'],['reports','گزارش اعضا','مشاهده گزارش‌های دریافتی']],3:[['notices','ابلاغیه‌ها','کارهایی که باید انجام دهید'],['report','نوشتن گزارش','ثبت نتیجه کار و پیوست‌ها']]};function header(){return `<header class="top"><div><div class="eyebrow">دبیرخانه میلیتاریسم</div><h1 class="title">${ROLE[role].name}</h1><div class="sub">${ROLE[role].person}</div></div><button class="ghost" data-action="logout">تغییر نقش</button></header>`}function render(){if(!role){app.innerHTML=`<section class="login"><div class="eyebrow">پژوهشکده</div><h1>دبیرخانه میلیتاریسم</h1><p class="hint">برای ورود، کد نقش خود را وارد کنید.</p><form id="loginForm"><label for="roleCode">کد ورود</label><input class="input code" id="roleCode" inputmode="numeric" autocomplete="off" maxlength="1" placeholder="—" required><div style="height:14px"></div><button class="primary">ورود</button></form>${message?`<div class="alert">${safe(message)}</div>`:''}<p class="note">نسخه آزمایشی: کد ۱ دبیر، کد ۲ معاون و کد ۳ عضو. این کدها رمز امنیتی نیستند.</p></section>`;return}const top=header();if(view==='home'){app.innerHTML=top+`<div class="stack">${configs[role].map(([id,title,desc])=>`<button class="tile" data-view="${id}"><span><strong>${title}</strong><small>${desc}</small></span><span class="chev">‹</span></button>`).join('')}</div><p class="foot">ساده، سریع، بدون مراحل اضافی</p>`;return}const names={notices:'صندوق ابلاغیه‌ها',report:'نوشتن گزارش',send:'صدور ابلاغیه',reports:'صندوق گزارش‌ها'};let body=`${top}<div class="sectionHead"><h2>${names[view]}</h2><button class="back" data-view="home">بازگشت ←</button></div>`;if(view==='notices'){const items=db.notices.filter(x=>x.to==role).sort((a,b)=>b.time-a.time);body+=items.length?items.map(x=>card(x,'notice')).join(''):`<div class="empty">هنوز ابلاغیه‌ای دریافت نشده است.</div>`}if(view==='reports'){const items=db.reports.filter(x=>role===1?x.from===2||x.from===3:x.from===3).sort((a,b)=>b.time-a.time);body+=items.length?items.map(x=>card(x,'report')).join(''):`<div class="empty">هنوز گزارشی دریافت نشده است.</div>`}if(view==='send'){body+=`<form id="sendForm"><div class="field"><label>عنوان ابلاغیه</label><input class="input" name="title" maxlength="250" required placeholder="موضوع دستور"></div><div class="field"><label>متن ابلاغیه</label><textarea class="input" name="body" required placeholder="چه کاری باید انجام شود؟"></textarea></div><button class="primary">ارسال ابلاغیه به ${role===1?'معاون':'اعضا'}</button></form>`}if(view==='report'){body+=`<form id="reportForm"><div class="field"><label>عنوان گزارش</label><input class="input" name="title" maxlength="250" required placeholder="عنوان کار انجام‌شده"></div><div class="field"><label>متن گزارش</label><textarea class="input" name="body" required placeholder="چه کاری انجام دادی؟ نتیجه چه بود؟"></textarea></div><div class="field"><label>لینک خروجی یا تلگرام (اختیاری)</label><input class="input" name="link" type="url" placeholder="https://..."></div><div class="field"><label>عکس یا فایل (اختیاری)</label><input class="input" name="attachments" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt,.zip"></div><button class="primary">ارسال گزارش به ${role===1?'روابط عمومی':role===2?'دبیر':'معاون'}</button></form><p class="note">متن گزارش محدودیت قراردادی ندارد. حجم پیوست‌ها به فضای مرورگر وابسته است؛ برای فایل‌های بزرگ لینک بگذارید.</p>`}if(message)body+=`<div class="${message.startsWith('ثبت شد')?'status':'alert'}">${safe(message)}</div>`;app.innerHTML=body}
function card(x,type){const who=type==='notice'?(x.from===1?'دبیر':x.from===2?'معاون':'روابط عمومی'):(x.from===2?'معاون':x.from===3?'عضو':'دبیر');const date=new Date(x.time).toLocaleString('fa-IR');let link='';try{if(x.link&&['http:','https:'].includes(new URL(x.link).protocol))link=`<p><a class="link" target="_blank" rel="noopener noreferrer" href="${safe(x.link)}">مشاهده لینک خروجی</a></p>`}catch{}return `<article class="item"><div class="tag">از طرف ${who}</div><h3>${safe(x.title)}</h3><p>${safe(x.body)}</p>${link}${(x.attachments||[]).map(a=>`<a class="attachment" download="${safe(a.name)}" href="${safe(a.data)}">📎 ${safe(a.name)}</a>`).join('')}<div class="meta">${date}</div>${type==='notice'&&!x.seen?`<button class="smallbutton" data-seen="${safe(x.id)}">تأیید دریافت</button>`:type==='notice'?`<div class="status">✓ دریافت تأیید شده</div>`:''}</article>`}
app.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;if(form.id==='loginForm'){const r=Number(form.roleCode.value);if(!ROLE[r]){message='کد نامعتبر است. عدد ۱، ۲ یا ۳ را وارد کنید.';render();return}role=r;view='home';message='';render();return}if(form.id==='sendForm'){db.notices.push({id:crypto.randomUUID?.()||String(Date.now()),from:role,to:role===1?2:3,title:form.elements.namedItem('title').value.trim(),body:form.elements.namedItem('body').value.trim(),time:Date.now(),seen:false});message=persist()?'ثبت شد؛ ابلاغیه به صندوق مقصد افزوده شد.':message;form.reset();render();return}if(form.id==='reportForm'){const selected=[...form.elements.namedItem('attachments').files];if(selected.reduce((s,f)=>s+f.size,0)>2*1024*1024){message='برای سبک و سریع ماندن این نمونه، حجم مجموع فایل‌ها حداکثر ۲ مگابایت است. فایل بزرگ را با لینک ارسال کنید.';render();return}const attachments=[];for(const f of selected){const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)});attachments.push({name:f.name,data})}db.reports.push({id:String(Date.now()),from:role,to:role===1?'pr':role===2?1:2,title:form.elements.namedItem('title').value.trim(),body:form.elements.namedItem('body').value.trim(),link:form.elements.namedItem('link').value.trim(),attachments,time:Date.now()});message=persist()?'ثبت شد؛ گزارش در صندوق مقصد قرار گرفت.':message;form.reset();render()}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='logout'){role=null;view='home';message='';render();return}if(b.dataset.view){view=b.dataset.view;message='';render();return}if(b.dataset.seen){const n=db.notices.find(x=>x.id===b.dataset.seen&&x.to===role);if(n){n.seen=true;persist();render()}}});render();})();</script></body></html>
