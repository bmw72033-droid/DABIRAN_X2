<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9f8">
  <meta name="color-scheme" content="light">
  <meta name="description" content="پنل سریع و مینیمال دبیرخانه میلیتاریسم؛ ابلاغ، اجرا و گزارش.">
  <title>دبیرخانه میلیتاریسم | پنل اعضا</title>
  <style>
    :root {--bg:#f7f9f8;--card:#fff;--ink:#172b28;--muted:#74817e;--line:#e6ebe8;--accent:#176557;--pale:#e9f3ef;--warning:#9b681c;--warnbg:#fff5e7;--radius:20px;--shadow:0 8px 34px rgba(21,42,35,.045)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,"IRANSans",Tahoma,"Segoe UI",sans-serif;font-size:14px;line-height:1.75}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:disabled{opacity:.58;cursor:progress}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #87bead;outline-offset:2px}
    a{color:var(--accent);overflow-wrap:anywhere}
    .wrap{max-width:710px;margin:auto;padding:0 20px}
    .hidden{display:none!important}
    .app-header{position:sticky;top:0;z-index:5;background:rgba(247,249,248,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .header-row{min-height:80px;display:flex;gap:12px;align-items:center;justify-content:space-between}
    .eyebrow{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.01em}
    .brand{font-size:18px;line-height:1.4;font-weight:850;letter-spacing:-.5px}
    .switch{border:1px solid var(--line);background:white;border-radius:13px;padding:7px 12px;color:var(--ink);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:7px}
    .switch svg{width:15px;height:15px}
    .page{padding-top:29px;padding-bottom:143px;animation:enter .22s ease both}
    @keyframes enter{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .h1{font-size:clamp(26px,5.3vw,34px);line-height:1.55;font-weight:850;letter-spacing:-.8px;margin:0}
    .sub{color:var(--muted);font-size:13px;margin:4px 0 0}
    .sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 13px}
    .sectionhead h2{font-size:15px;margin:0;font-weight:850}
    .sectionhead .meta{color:var(--muted);font-size:12px}
    .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
    .stat{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 17px;min-height:91px}
    .stat .n{font-size:27px;font-weight:850;line-height:1.4;font-variant-numeric:tabular-nums}
    .stat .l{color:var(--muted);font-size:12px}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:19px}
    .btn{border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-height:45px;font-weight:800;color:var(--ink);background:white;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:normal;text-align:center;transition:background .15s,transform .15s}
    .btn:active{transform:scale(.985)}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.soft{background:var(--pale);color:var(--accent);border-color:transparent}
    .btn.small{min-height:36px;font-size:12px;padding:6px 11px;border-radius:10px}
    .btn svg{height:16px;width:16px;flex-shrink:0}
    .task-list{display:grid;gap:10px}
    .task{border:1px solid var(--line);border-radius:var(--radius);background:#fff;text-align:right;width:100%;padding:16px;display:flex;gap:13px;align-items:center;box-shadow:var(--shadow);color:inherit}
    .task:active{background:#f3f8f5}
    .task-main{flex:1;min-width:0}
    .task-title{font-size:14px;font-weight:800;line-height:1.7;white-space:normal;overflow-wrap:anywhere}
    .task-meta{display:flex;flex-wrap:wrap;gap:8px 12px;color:var(--muted);font-size:11px;margin-top:7px}
    .task-arrow{flex-shrink:0;color:#a5afaa;font-size:24px;line-height:1;transform:rotate(180deg)}
    .badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--pale);color:var(--accent);white-space:nowrap}
    .badge.wait{background:var(--warnbg);color:var(--warning)}
    .badge.done{background:#f0f2f1;color:#6c7975}
    .stack{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .hint{margin-top:23px;font-size:11px;line-height:1.8;color:#899590}
    .empty{text-align:center;border:1px dashed #d7e1db;border-radius:20px;padding:37px 20px;background:rgba(255,255,255,.65)}
    .empty strong{display:block;font-size:14px;margin-bottom:4px}
    .empty span{font-size:12px;color:var(--muted)}
    .notice{border:1px solid #e5e9e7;background:#eff3f1;color:#687873;padding:9px 12px;border-radius:12px;font-size:11px;margin-top:21px}
    .bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
    .bottom-inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:710px;margin:auto;padding:7px 12px 8px;gap:5px}
    .navbtn{border:0;background:transparent;color:#7b8983;padding:6px 2px 4px;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:750;position:relative}
    .navbtn.active{color:var(--accent);background:#edf6f1}
    .navbtn svg{width:19px;height:19px;stroke-width:1.8}
    .dot{position:absolute;top:5px;right:calc(50% - 16px);border:2px solid #fff;background:#d77943;min-width:9px;height:9px;border-radius:9px}
    .selector{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:30px 20px}
    .select-inner{width:100%;max-width:480px}
    .select-kicker{font-size:12px;color:var(--accent);font-weight:800;margin-bottom:11px}
    .select-title{font-size:clamp(29px,7vw,40px);letter-spacing:-1px;line-height:1.35;font-weight:900;margin:0}
    .select-description{color:var(--muted);margin:12px 0 29px;font-size:14px}
    .role-item{border:1px solid var(--line);width:100%;background:#fff;color:var(--ink);border-radius:18px;padding:16px 18px;margin-bottom:11px;text-align:right;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
    .role-item:active{transform:scale(.988)}
    .role-item:hover{border-color:#aacbc0}
    .role-title{display:block;font-size:16px;font-weight:850}
    .role-desc{display:block;font-size:12px;color:var(--muted);margin-top:2px}
    .role-arrow{font-size:24px;color:var(--accent)}
    .select-foot{font-size:11px;line-height:2;color:#8b9892;margin-top:22px}
    .segmented{display:flex;gap:4px;background:#edf1ef;border-radius:13px;padding:4px;margin-top:20px}
    .segmented button{border:0;background:transparent;flex:1;padding:8px;border-radius:10px;color:#677771;font-size:12px;font-weight:800}
    .segmented button.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(20,40,30,.07)}
    .modal-layer{position:fixed;inset:0;z-index:20;background:rgba(20,39,31,.44);display:flex;align-items:flex-end;justify-content:center;animation:fade .17s ease}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .modal{width:100%;max-width:690px;background:#fff;border-radius:25px 25px 0 0;max-height:min(94svh,980px);display:flex;flex-direction:column;box-shadow:0 -18px 45px rgba(6,21,13,.17)}
    .modal-top{padding:17px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
    .modal-top h2{margin:0;font-size:17px;font-weight:850}
    .iconbtn{border:0;border-radius:10px;background:#f2f5f3;color:var(--ink);width:34px;height:34px;font-size:20px;line-height:1;display:grid;place-items:center}
    .modal-body{overflow-y:auto;padding:17px 20px 30px;overscroll-behavior:contain;min-height:0}
    .field{margin-bottom:17px}
    .field label{display:block;font-weight:800;font-size:12px;margin-bottom:7px}
    .field .help{display:block;color:var(--muted);font-size:11px;margin-top:6px}
    .control{width:100%;display:block;border:1px solid #dfe6e1;background:#fff;border-radius:12px;padding:11px 13px;min-height:46px;color:var(--ink);outline:none;font-size:14px}
    .control:focus{border-color:#69a493;box-shadow:0 0 0 3px #e7f3ed}
    textarea.control{min-height:113px;resize:vertical;line-height:1.95}
    .file-control{border:1px dashed #cbd8d0;background:#f8faf9;padding:13px;border-radius:12px;width:100%}
    .file-list{margin-top:9px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
    .fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .form-actions{display:flex;gap:9px;position:sticky;bottom:-30px;background:#fff;padding:11px 0 calc(env(safe-area-inset-bottom,0px) + 8px);border-top:1px solid #f1f3f2}
    .form-actions .btn{flex:1}
    .detail-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:2.1;margin:16px 0}
    .details-label{font-size:11px;color:var(--muted);margin-bottom:2px}
    .details-value{font-size:13px;font-weight:750;overflow-wrap:anywhere}
    .infobox{background:#f5f8f6;border-radius:14px;padding:13px 15px;margin:13px 0}
    .resource{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .resource button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;font-size:12px;color:var(--ink);max-width:100%;overflow-wrap:anywhere}
    .toast{position:fixed;z-index:50;bottom:88px;left:50%;transform:translateX(-50%);background:#1b322b;color:#fff;max-width:min(480px,90vw);min-width:170px;padding:10px 16px;border-radius:12px;text-align:center;font-size:12px;box-shadow:0 8px 25px #15292140;animation:enter .2s ease}
    .report-links{white-space:pre-wrap;overflow-wrap:anywhere;line-height:2.1}
    .report-links a{display:inline-block;margin-top:4px}
    .error{color:#b33c2f;background:#fff1ee;border-radius:10px;padding:10px;font-size:12px;margin-bottom:11px}
    @media(min-width:720px){.page{padding-top:39px}.bottom{left:50%;right:auto;width:710px;transform:translateX(-50%);bottom:17px;border-radius:18px;border:1px solid var(--line);box-shadow:0 5px 30px #13352913;padding-bottom:0}.modal-layer{align-items:center;padding:20px}.modal{border-radius:23px;max-height:min(90vh,900px)}.select-inner{max-width:470px}.select-title{font-size:38px}}
    @media(max-width:360px){.wrap{padding:0 14px}.header-row{min-height:73px}.brand{font-size:16px}.role-item{padding:14px}.fieldgrid{grid-template-columns:1fr}.task{padding:13px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  "use strict";
  const roleInfo={secretary:{name:'SS GELB',label:'دبیر',incoming:'روابط عمومی',outgoing:'روابط عمومی',lower:'deputy',lowerName:'ارشیا'},deputy:{name:'ارشیا',label:'معاون',incoming:'دبیر',outgoing:'دبیر',lower:'member',lowerName:'عضو دبیرخانه'},member:{name:'عضو دبیرخانه',label:'عضو',incoming:'معاون',outgoing:'معاون',lower:null,lowerName:null}};
  const topRole={secretary:'public_relations',deputy:'secretary',member:'deputy'};
  const roleName={public_relations:'روابط عمومی',secretary:'SS GELB',deputy:'ارشیا',member:'عضو دبیرخانه'};
  const S={role:null,tab:'home',scope:'received',tasks:[],reports:[],modal:null,db:null,error:null,submitting:false};
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const id=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2);
  const todayISO=offset=>{const d=new Date();d.setDate(d.getDate()+offset);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  const dateFa=s=>{if(!s)return 'بدون مهلت';const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(s)?s+'T12:00:00':s);return isNaN(d)?s:new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'short',day:'numeric'}).format(d)};
  const relativeTime=s=>{if(!s)return '';const delta=Math.max(0,Date.now()-new Date(s).getTime());if(delta<60000)return 'همین الان';if(delta<3600000)return Math.floor(delta/60000).toLocaleString('fa-IR')+' دقیقه پیش';if(delta<86400000)return Math.floor(delta/3600000).toLocaleString('fa-IR')+' ساعت پیش';return dateFa(s)};
  const ic=(name)=>{const p={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',mail:'<rect width="18" height="14" x="3" y="5" rx="2"/><path d="m3 7 9 6 9-6"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',swap:'<path d="M8 3 4 7l4 4M4 7h13a3 3 0 0 1 3 3v2M16 21l4-4-4-4m4 4H7a3 3 0 0 1-3-3v-2"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="m15 18-6-6 6-6"/>'}[name]||'';return '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'};
  function toast(message){const old=$('toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.id='toast';t.textContent=message;document.body.appendChild(t);setTimeout(()=>{if(t.isConnected)t.remove()},3200)}
  function dbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open('DabiranMilitarismDemoV1',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('tasks'))db.createObjectStore('tasks',{keyPath:'id'});if(!db.objectStoreNames.contains('reports'))db.createObjectStore('reports',{keyPath:'id'});if(!db.objectStoreNames.contains('attachments'))db.createObjectStore('attachments',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  function all(store){return new Promise((resolve,reject)=>{const tx=S.db.transaction(store,'readonly'),r=tx.objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
  function one(store,key){return new Promise((resolve,reject)=>{const tx=S.db.transaction(store,'readonly'),r=tx.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
  function put(store,object){return new Promise((resolve,reject)=>{const tx=S.db.transaction(store,'readwrite');tx.objectStore(store).put(object);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
  function saveReportWithFiles(report,files){return new Promise((resolve,reject)=>{const tx=S.db.transaction(['reports','attachments'],'readwrite');tx.objectStore('reports').put(report);const dst=tx.objectStore('attachments');files.forEach((f,i)=>dst.put({id:report.attachments[i].id,reportId:report.id,name:f.name,type:f.type,blob:f}));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
  async function reload(){S.tasks=(await all('tasks')).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));S.reports=(await all('reports')).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))}
  async function seed(){if((await all('tasks')).length)return;const d=[{from:'public_relations',to:'secretary',title:'بررسی منابع عمومی تاریخ فناوری رادار',body:'فهرستی از منابع قابل استناد تهیه و یک جمع‌بندی کوتاه از سیر تحول فناوری رادار آماده کنید.',due:todayISO(5)},{from:'secretary',to:'deputy',title:'جمع‌آوری منابع پژوهشی',body:'سه منبع عمومی درباره تاریخ فناوری رادار معرفی کنید و نکات کلیدی هر منبع را بنویسید.',due:todayISO(3)},{from:'deputy',to:'member',title:'خلاصه یک مقاله پژوهشی',body:'یک مقاله عمومی مرتبط را مطالعه و خلاصه‌ای روان همراه با لینک منبع آماده کنید. پس از اتمام، گزارش را همین‌جا ثبت کنید.',due:todayISO(2)}];for(const x of d)await put('tasks',{...x,id:id(),createdAt:new Date(Date.now()-120000).toISOString(),acknowledgedAt:null,submittedAt:null,parentId:null,demo:true})}
  const inboxTasks=()=>S.tasks.filter(t=>t.to===S.role);
  const ownReports=()=>S.reports.filter(r=>r.from===S.role);
  const incomingReports=()=>S.reports.filter(r=>r.to===S.role);
  const unseenTasks=()=>inboxTasks().filter(t=>!t.acknowledgedAt).length;
  const unreadReports=()=>incomingReports().filter(r=>!r.readAt).length;
  function badge(label,style=''){return '<span class="badge '+style+'">'+label+'</span>'}
  function taskStatus(t){if(t.submittedAt)return badge('گزارش ثبت شد','done');if(t.acknowledgedAt)return badge('دریافت شد');return badge('جدید','wait')}
  function taskCard(t){return '<button type="button" class="task" data-act="open-task" data-id="'+esc(t.id)+'"><span class="task-main"><span class="stack"><span class="task-title">'+esc(t.title)+'</span>'+taskStatus(t)+'</span><span class="task-meta"><span>از: '+esc(roleName[t.from]||'مدیریت')+'</span><span>مهلت: '+esc(dateFa(t.due))+'</span></span></span><span class="task-arrow" aria-hidden="true">‹</span></button>'}
  function reportCard(r){return '<button type="button" class="task" data-act="open-report" data-id="'+esc(r.id)+'"><span class="task-main"><span class="stack"><span class="task-title">'+esc(r.title)+'</span>'+(!r.readAt&&r.to===S.role?badge('خوانده نشده','wait'):'')+'</span><span class="task-meta"><span>'+esc(r.from===S.role?'برای: '+(roleName[r.to]||r.to):'از: '+(roleName[r.from]||r.from))+'</span><span>'+esc(relativeTime(r.createdAt))+'</span></span></span><span class="task-arrow" aria-hidden="true">‹</span></button>'}
  function empty(title,sub){return '<div class="empty"><strong>'+esc(title)+'</strong><span>'+esc(sub)+'</span></div>'}
  function actions(){return '<div class="actions"><button class="btn primary" data-act="new-report">'+ic('plus')+' ثبت گزارش</button>'+(roleInfo[S.role].lower?'<button class="btn" data-act="new-notice">'+ic('plus')+' ابلاغ جدید</button>':'')+'</div>'}
  function viewHome(){const tasks=inboxTasks();const todo=tasks.filter(t=>!t.submittedAt);return '<div class="eyebrow">'+esc(roleInfo[S.role].label)+' دبیرخانه</div><h1 class="h1">سلام، '+esc(roleInfo[S.role].name)+'</h1><p class="sub">کارها مشخص‌اند؛ انجام بده و گزارش بفرست.</p><div class="stats"><div class="stat"><div class="n">'+todo.length.toLocaleString('fa-IR')+'</div><div class="l">کارهای من</div></div><div class="stat"><div class="n">'+ownReports().length.toLocaleString('fa-IR')+'</div><div class="l">گزارش‌های ثبت‌شده</div></div></div>'+actions()+'<div class="sectionhead"><h2>کارهای در انتظار</h2><span class="meta">'+todo.length.toLocaleString('fa-IR')+' مورد</span></div><div class="task-list">'+(todo.length?todo.slice(0,6).map(taskCard).join(''):empty('کاری در انتظار نیست','ابلاغ‌های تازه اینجا نمایش داده می‌شوند.'))+'</div>'+(tasks.length>6?'<div class="actions"><button class="btn small" data-act="change-tab" data-tab="notices">همه ابلاغیه‌ها</button></div>':'')+'<div class="notice">نسخه آزمایشی: اطلاعات فقط در همین مرورگر ذخیره می‌شود و هنوز بین گوشی‌ها یا با پنل روابط عمومی همگام نیست.</div>'}
  function viewNotices(){const tasks=inboxTasks();return '<h1 class="h1">صندوق ابلاغیه‌ها</h1><p class="sub">دستورهایی که برای شما ارسال شده‌اند.</p><div class="sectionhead"><h2>ابلاغ‌های دریافتی</h2><span class="meta">'+tasks.length.toLocaleString('fa-IR')+' مورد</span></div><div class="task-list">'+(tasks.length?tasks.map(taskCard).join(''):empty('صندوق خالی است','فعلاً ابلاغ جدیدی ندارید.'))+'</div>'+(roleInfo[S.role].lower?'<div class="actions"><button class="btn primary" data-act="new-notice">'+ic('plus')+' ابلاغ به '+esc(roleInfo[S.role].lowerName)+'</button></div>':'')}
  function viewReports(){const received=incomingReports(),sent=ownReports();if(S.role==='member')S.scope='sent';const isReceived=S.scope==='received'&&S.role!=='member';const selected=isReceived?received:sent;return '<h1 class="h1">صندوق گزارش‌ها</h1><p class="sub">گزارش‌ها را بخوان یا گزارش جدید ثبت کن.</p>'+(S.role==='member'?'':'<div class="segmented"><button data-act="scope" data-scope="received" class="'+(isReceived?'active':'')+'">دریافتی ('+received.length.toLocaleString('fa-IR')+')</button><button data-act="scope" data-scope="sent" class="'+(!isReceived?'active':'')+'">ارسالی ('+sent.length.toLocaleString('fa-IR')+')</button></div>')+'<div class="sectionhead"><h2>'+ (isReceived?'گزارش‌های دریافتی':'گزارش‌های ارسالی')+'</h2><span class="meta">'+selected.length.toLocaleString('fa-IR')+' مورد</span></div><div class="task-list">'+(selected.length?selected.map(reportCard).join(''):empty('هنوز گزارشی اینجا نیست',isReceived?'گزارش‌های اعضای زیرمجموعه اینجا می‌رسند.':'گزارش‌های نوشته‌شده شما اینجا ذخیره می‌شوند.'))+'</div><div class="actions"><button class="btn primary" data-act="new-report">'+ic('plus')+' نوشتن گزارش</button></div>'}
  function rolePage(){return '<main class="selector"><div class="select-inner"><div class="select-kicker">دبیرخانه میلیتاریسم</div><h1 class="select-title">شما چه کسی هستید؟</h1><p class="select-description">نقش خود را انتخاب کنید و مستقیم وارد کارها شوید.</p>'+Object.entries(roleInfo).map(([k,v])=>'<button class="role-item" data-act="choose-role" data-role="'+k+'"><span><span class="role-title">'+(k==='member'?'عضو دبیرخانه':esc(v.label)+' : '+esc(v.name))+'</span><span class="role-desc">'+(k==='secretary'?'دریافت از روابط عمومی · گزارش به روابط عمومی':k==='deputy'?'دریافت از دبیر · ابلاغ به اعضا':'دریافت کار · انجام و ثبت گزارش')+'</span></span><span class="role-arrow">‹</span></button>').join('')+'<p class="select-foot">نسخه نمایشی است. انتخاب نقش، احراز هویت واقعی نیست و اطلاعات فقط در همین دستگاه نگهداری می‌شود.</p></div></main>'}
  function shell(){const tab=S.tab;return '<header class="app-header"><div class="wrap header-row"><div><div class="eyebrow">سامانه دبیرخانه‌ها</div><div class="brand">دبیرخانه میلیتاریسم</div></div><button class="switch" data-act="switch-role">'+ic('swap')+' تغییر نقش</button></div></header><main class="wrap page">'+(tab==='home'?viewHome():tab==='notices'?viewNotices():viewReports())+'</main><nav class="bottom" aria-label="منوی اصلی"><div class="bottom-inner">'+[['home','خانه','home'],['notices','ابلاغیه‌ها','mail'],['reports','گزارش‌ها','file']].map(([key,label,icon])=>'<button data-act="change-tab" data-tab="'+key+'" class="navbtn '+(tab===key?'active':'')+'" '+(tab===key?'aria-current="page"':'')+'>'+ic(icon)+(key==='notices'&&unseenTasks()>0||key==='reports'&&unreadReports()>0?'<i class="dot" aria-label="مورد جدید"></i>':'')+'<span>'+label+'</span></button>').join('')+'</div></nav>'}
  function modalFrame(title,body){return '<div class="modal-layer" id="modalLayer"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modal-top"><h2>'+esc(title)+'</h2><button class="iconbtn" data-act="close-modal" aria-label="بستن">×</button></div><div class="modal-body">'+body+'</div></section></div>'}
  function taskDetails(task){return '<div class="stack">'+taskStatus(task)+'</div><div class="infobox"><div class="details-label">ابلاغ از</div><div class="details-value">'+esc(roleName[task.from]||task.from)+'</div><div class="details-label" style="margin-top:8px">مهلت</div><div class="details-value">'+esc(dateFa(task.due))+'</div></div><div class="details-label">شرح مأموریت</div><div class="detail-text">'+esc(task.body||'توضیحی ثبت نشده است.')+'</div><div class="actions">'+(!task.acknowledgedAt?'<button class="btn soft" data-act="ack-task" data-id="'+esc(task.id)+'">'+ic('check')+' دریافت کردم</button>':'')+'<button class="btn primary" data-act="report-task" data-id="'+esc(task.id)+'">'+ic('file')+' ثبت گزارش این کار</button>'+(roleInfo[S.role].lower?'<button class="btn" data-act="delegate-task" data-id="'+esc(task.id)+'">ابلاغ به '+esc(roleInfo[S.role].lowerName)+'</button>':'')+'</div><p class="hint">تأیید دریافت، به معنای پایان انجام کار نیست؛ نتیجه را جداگانه گزارش کنید.</p>'}
  function noticeForm(parentId){const parent=S.tasks.find(x=>x.id===parentId);return '<form id="noticeForm"><div class="field"><label>برای</label><div class="infobox">'+esc(roleInfo[S.role].lowerName)+'</div></div><div class="field"><label for="noticeTitle">موضوع ابلاغیه</label><input id="noticeTitle" name="title" class="control" required placeholder="عنوان کار" value="'+esc(parent?parent.title:'')+'"></div><div class="field"><label for="noticeBody">توضیح کار</label><textarea id="noticeBody" name="body" class="control" rows="5" placeholder="چه کاری باید انجام شود؟" required>'+esc(parent?parent.body:'')+'</textarea></div><div class="field"><label for="noticeDue">مهلت (اختیاری)</label><input type="date" id="noticeDue" name="due" class="control" value="'+esc(parent?.due||todayISO(3))+'"></div><input type="hidden" name="parentId" value="'+esc(parentId||'')+'"><div id="formError"></div><div class="form-actions"><button type="submit" class="btn primary" id="submitBtn">ثبت و ابلاغ</button><button class="btn" type="button" data-act="close-modal">انصراف</button></div></form>'}
  function reportForm(taskId){const list=inboxTasks(),matched=S.tasks.find(t=>t.id===taskId);return '<form id="reportForm"><div class="field"><label>گزارش برای</label><div class="infobox">'+esc(roleInfo[S.role].outgoing)+'</div></div><div class="field"><label for="reportTask">مربوط به کدام کار؟</label><select class="control" name="taskId" id="reportTask"><option value="">گزارش مستقل</option>'+list.map(t=>'<option value="'+esc(t.id)+'" '+(t.id===taskId?'selected':'')+'>'+esc(t.title)+'</option>').join('')+'</select></div><div class="field"><label for="reportTitle">عنوان گزارش</label><input class="control" name="title" id="reportTitle" placeholder="عنوان کوتاه" value="'+esc(matched?'گزارش: '+matched.title:'')+'" required></div><div class="field"><label for="reportBody">متن و نتیجه کار</label><textarea class="control" name="body" id="reportBody" rows="7" placeholder="چه کاری انجام شد؟ نتیجه چه بود؟\nهرقدر لازم است بنویسید؛ محدودیت تعداد کاراکتر در فرم وجود ندارد."></textarea></div><div class="field"><label for="reportLinks">لینک‌ها (اختیاری)</label><textarea class="control" name="links" id="reportLinks" rows="2" placeholder="لینک پست تلگرام یا منابع؛ هر لینک در یک سطر"></textarea></div><div class="field"><label for="reportFiles">تصاویر و فایل‌ها (اختیاری)</label><input type="file" class="file-control" name="files" id="reportFiles" multiple><div class="file-list" id="chosenFiles">فایلی انتخاب نشده است.</div><span class="help">محدودیت مصنوعی برای حجم و تعداد فایل نگذاشته‌ایم؛ ظرفیت ذخیره‌سازی دستگاه و مرورگر همچنان محدود است.</span></div><div id="formError"></div><div class="form-actions"><button type="submit" id="submitBtn" class="btn primary">ثبت گزارش</button><button class="btn" type="button" data-act="close-modal">انصراف</button></div></form>'}
  function validLink(raw){try{const u=new URL(raw);return (u.protocol==='https:'||u.protocol==='http:')?u.href:null}catch{return null}}
  function renderLinks(raw){return (raw||'').split(/\n/).filter(x=>x.trim()).map(x=>{const safe=validLink(x.trim());return safe?'<div><a target="_blank" rel="noopener noreferrer" href="'+esc(safe)+'">'+esc(x.trim())+'</a></div>':'<div>'+esc(x.trim())+'</div>'}).join('')}
  function reportDetails(r){const attachments=r.attachments||[];return '<div class="stack">'+badge(r.from===S.role?'ارسالی':'دریافتی')+'</div><div class="infobox"><div class="details-label">از / به</div><div class="details-value">'+esc(roleName[r.from]||r.from)+' ← '+esc(roleName[r.to]||r.to)+'</div><div class="details-label" style="margin-top:8px">تاریخ ثبت</div><div class="details-value">'+esc(dateFa(r.createdAt))+'</div></div><div class="details-label">متن گزارش</div><div class="detail-text">'+esc(r.body||'متنی ثبت نشده است.')+'</div>'+(r.links?'<div class="details-label">لینک‌ها</div><div class="report-links">'+renderLinks(r.links)+'</div>':'')+(attachments.length?'<div class="details-label" style="margin-top:16px">فایل‌های ضمیمه</div><div class="resource">'+attachments.map(f=>'<button type="button" data-act="download" data-id="'+esc(f.id)+'">'+esc(f.name)+' ↓</button>').join('')+'</div>':'')+'<div class="actions"><button class="btn soft" data-act="copy-report" data-id="'+esc(r.id)+'">کپی متن گزارش</button>'+(r.to===S.role?'<button class="btn primary" data-act="forward-report" data-id="'+esc(r.id)+'">'+(r.forwardedAt?'ارسال دوباره به ':'ارسال به ')+esc(roleInfo[S.role].outgoing)+'</button>':'')+'</div>'}
  function render(){if(!S.db){$('app').innerHTML='<div class="selector"><div class="select-inner"><h1 class="select-title">'+(S.error?'خطا در بارگذاری':'در حال آماده‌سازی…')+'</h1><p class="select-description">'+esc(S.error||'')+'</p></div></div>';return}let main=S.role?shell():rolePage();if(S.modal){const m=S.modal;let b='',title='';if(m.type==='task'){const t=S.tasks.find(x=>x.id===m.id);if(t){title=t.title;b=taskDetails(t)}}if(m.type==='report-detail'){const r=S.reports.find(x=>x.id===m.id);if(r){title=r.title;b=reportDetails(r)}}if(m.type==='notice'){title='ابلاغ مأموریت';b=noticeForm(m.parentId)}if(m.type==='report'){title='ثبت گزارش';b=reportForm(m.taskId)}if(b)main+=modalFrame(title,b)}$('app').innerHTML=main;const heading=document.querySelector('.modal h2');if(heading)heading.setAttribute('tabindex','-1')}
  async function chooseRole(role){if(!roleInfo[role])return;S.role=role;S.tab='home';S.scope='received';S.modal=null;try{sessionStorage.setItem('mil_role_demo',role)}catch{}render();window.scrollTo(0,0)}
  const setModal=x=>{S.modal=x;render()};
  async function ackTask(taskId){const t=S.tasks.find(x=>x.id===taskId&&x.to===S.role);if(!t)return;const copy={...t,acknowledgedAt:new Date().toISOString()};try{await put('tasks',copy);await reload();setModal({type:'task',id:t.id});toast('دریافت مأموریت ثبت شد')}catch(e){toast('ذخیره انجام نشد؛ حافظه مرورگر را بررسی کنید')}}
  async function openReport(reportId){const r=S.reports.find(x=>x.id===reportId);if(!r||r.from!==S.role&&r.to!==S.role)return;if(r.to===S.role&&!r.readAt){try{await put('reports',{...r,readAt:new Date().toISOString()});await reload()}catch(e){toast('ثبت وضعیت خواندن ممکن نشد')}}setModal({type:'report-detail',id:reportId})}
  function formError(txt){const e=$('formError');if(e)e.innerHTML='<div class="error">'+esc(txt)+'</div>'}
  async function submitNotice(form){if(S.submitting||!roleInfo[S.role].lower)return;const fd=new FormData(form),title=String(fd.get('title')||'').trim(),body=String(fd.get('body')||'').trim();if(!title||!body){formError('عنوان و توضیحات را وارد کنید.');return}S.submitting=true;const btn=$('submitBtn');if(btn)btn.disabled=true;const task={id:id(),title,body,due:String(fd.get('due')||''),from:S.role,to:roleInfo[S.role].lower,createdAt:new Date().toISOString(),acknowledgedAt:null,submittedAt:null,parentId:String(fd.get('parentId')||'')||null};try{await put('tasks',task);await reload();S.modal=null;render();toast('ابلاغ ثبت شد؛ با تغییر نقش می‌توانید آن را ببینید.')}catch(e){formError('ذخیره ابلاغیه ناموفق بود؛ ظرفیت ذخیره‌سازی را بررسی کنید.')}finally{S.submitting=false;if($('submitBtn'))$('submitBtn').disabled=false}}
  async function submitReport(form){if(S.submitting)return;const fd=new FormData(form),title=String(fd.get('title')||'').trim(),body=String(fd.get('body')||''),links=String(fd.get('links')||''),files=Array.from($('reportFiles')?.files||[]),taskId=String(fd.get('taskId')||'');if(!title){formError('عنوان گزارش را وارد کنید.');return}if(!body.trim()&&!links.trim()&&!files.length){formError('متن گزارش، لینک یا حداقل یک فایل لازم است.');return}S.submitting=true;if($('submitBtn')){$('submitBtn').disabled=true;$('submitBtn').textContent='در حال ذخیره…'}const reportId=id();const report={id:reportId,title,body,links,taskId:taskId||null,from:S.role,to:topRole[S.role],createdAt:new Date().toISOString(),readAt:null,attachments:files.map(f=>({id:id(),name:f.name,size:f.size,type:f.type}))};try{await saveReportWithFiles(report,files);if(taskId){const task=S.tasks.find(t=>t.id===taskId&&t.to===S.role);if(task)await put('tasks',{...task,submittedAt:new Date().toISOString(),acknowledgedAt:task.acknowledgedAt||new Date().toISOString()})}await reload();S.modal=null;S.tab='reports';S.scope='sent';render();toast('گزارش در نسخه آزمایشی ذخیره شد.')}catch(e){formError('گزارش ذخیره نشد. ممکن است فضای مرورگر برای فایل‌ها کافی نباشد. گزارش را کوتاه‌تر نکنید؛ از اطلاعات مهم نسخه پشتیبان بگیرید.')}finally{S.submitting=false;if($('submitBtn')){$('submitBtn').disabled=false;$('submitBtn').textContent='ثبت گزارش'}}}
  async function forwardReport(reportId){const source=S.reports.find(r=>r.id===reportId&&r.to===S.role);if(!source||S.submitting)return;S.submitting=true;const forwarded={...source,id:id(),from:S.role,to:topRole[S.role],createdAt:new Date().toISOString(),readAt:null,forwardedFromId:source.id,forwardedAt:null};try{await put('reports',forwarded);await put('reports',{...source,forwardedAt:new Date().toISOString()});await reload();S.modal=null;S.tab='reports';S.scope='sent';render();toast('گزارش در نسخه آزمایشی به صندوق ارسالی منتقل شد.')}catch(e){toast('ارسال آزمایشی انجام نشد؛ دوباره امتحان کنید.')}finally{S.submitting=false}}
  async function downloadAttachment(fileId){const att=await one('attachments',fileId);if(!att){toast('فایل پیدا نشد');return}const u=URL.createObjectURL(att.blob);const a=document.createElement('a');a.href=u;a.download=att.name||'file';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
  function copyReport(reportId){const r=S.reports.find(x=>x.id===reportId);if(!r)return;const value=[r.title,r.body,r.links].filter(Boolean).join('\n\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(()=>toast('متن گزارش کپی شد')).catch(()=>fallbackCopy(value))}else fallbackCopy(value)}
  function fallbackCopy(txt){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('متن گزارش کپی شد')}catch{toast('کپی خودکار ممکن نبود')}t.remove()}
  document.addEventListener('click',async ev=>{if(ev.target.id==='modalLayer'){S.modal=null;render();return}const btn=ev.target.closest('[data-act]');if(!btn)return;const act=btn.dataset.act;const identifier=btn.dataset.id;try{if(act==='choose-role')return chooseRole(btn.dataset.role);if(act==='switch-role'){S.role=null;S.modal=null;try{sessionStorage.removeItem('mil_role_demo')}catch{}render();return}if(act==='change-tab'){S.tab=btn.dataset.tab;S.modal=null;render();window.scrollTo(0,0);return}if(act==='scope'){S.scope=btn.dataset.scope;render();return}if(act==='new-notice'&&roleInfo[S.role]?.lower)return setModal({type:'notice',parentId:null});if(act==='new-report')return setModal({type:'report',taskId:null});if(act==='open-task'){const t=S.tasks.find(x=>x.id===identifier&&x.to===S.role);if(t)return setModal({type:'task',id:t.id})}if(act==='open-report')return openReport(identifier);if(act==='close-modal'){S.modal=null;render();return}if(act==='ack-task')return ackTask(identifier);if(act==='report-task'){const t=S.tasks.find(x=>x.id===identifier&&x.to===S.role);if(t)return setModal({type:'report',taskId:t.id})}if(act==='delegate-task'&&roleInfo[S.role]?.lower){const t=S.tasks.find(x=>x.id===identifier&&x.to===S.role);if(t)return setModal({type:'notice',parentId:t.id})}if(act==='download')return await downloadAttachment(identifier);if(act==='forward-report')return await forwardReport(identifier);if(act==='copy-report')return copyReport(identifier)}catch(e){toast('این عملیات انجام نشد. دوباره امتحان کنید.')}});
  document.addEventListener('submit',async ev=>{if(ev.target.id==='noticeForm'){ev.preventDefault();await submitNotice(ev.target)}if(ev.target.id==='reportForm'){ev.preventDefault();await submitReport(ev.target)}});
  document.addEventListener('change',ev=>{if(ev.target.id==='reportFiles'){const f=Array.from(ev.target.files||[]);const out=$('chosenFiles');if(out)out.textContent=f.length?f.map(x=>x.name).join('، '):'فایلی انتخاب نشده است.'}});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.modal){S.modal=null;render()}});
  async function start(){try{S.db=await dbOpen();await seed();await reload();try{const r=sessionStorage.getItem('mil_role_demo');if(roleInfo[r])S.role=r}catch{}render()}catch(e){S.error='مرورگر اجازه ذخیره‌سازی محلی نمی‌دهد. از حالت ناشناس خارج شوید یا مجوز ذخیره‌سازی این سایت را فعال کنید.';render()}}
  start();
})();
</script>
</body>
</html>
