.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select,.select{display:block;width:100%;padding:12px 13px;background:var(--card);border:1px solid var(--line);border-radius:11px;color:var(--fg);outline:none;min-height:51px}.field textarea{min-height:170px;resize:vertical;line-height:2}.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}.pin{text-align:center;direction:ltr;font-size:31px!important;font-weight:800;letter-spacing:4px}.btn{background:var(--accent);color:var(--accenttext);font-weight:800;min-height:49px;border:0;border-radius:11px;padding:10px 16px}.btn.alt{background:var(--sub);color:var(--fg);border:1px solid var(--line)}.btn.tiny{min-height:33px;font-size:12px;padding:6px 12px}.btn.block{width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:27px}.top h1{margin:0;font-size:18px}.top small{display:block;font-size:11px;margin-top:2px}.bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tiles{display:grid;gap:12px}.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{display:block;width:100%;min-height:85px;border:1px solid var(--line);border-radius:14px;text-align:right;padding:18px;background:var(--card);color:var(--fg)}.tile b{display:block;font-size:15px}.tile small{font-size:12px}.tile:active{transform:scale(.99)}.panel{border:1px solid var(--line);border-radius:14px;padding:17px;background:var(--card);margin-bottom:12px}.groups{display:grid;gap:10px}.group{display:flex;align-items:center;justify-content:space-between;gap:10px}.group h3{margin:0 0 4px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{border:1px solid var(--line);background:var(--sub);color:var(--fg);border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;min-height:40px}.mutednote{font-size:12px;line-height:2;color:var(--muted)}.notice{padding:12px 14px;background:var(--sub);border-radius:10px;margin:12px 0;border:1px solid var(--line);color:var(--good);font-size:12px;line-height:2;overflow-wrap:anywhere}.notice.error{color:var(--danger)}.card{border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:11px;background:var(--card);overflow-wrap:anywhere}.card-header{display:flex;justify-content:space-between;gap:12px;align-items:start}.meta{font-size:11px;color:var(--muted);line-height:1.9}.bodytext{white-space:pre-wrap;line-height:2.1;font-size:13px;margin:13px 0}.chip{border-radius:7px;padding:3px 7px;background:var(--sub);font-size:11px;white-space:nowrap}.empty{text-align:center;padding:35px 12px;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.section{font-weight:800;margin:23px 0 11px}.filelist{margin-top:10px;display:grid;gap:6px}.filelist a{font-size:12px;word-break:break-all;color:var(--fg)}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.code{font-variant-numeric:tabular-nums}.diag{font-size:11px;line-height:1.8;color:var(--muted);text-align:center;margin-top:22px}.badge{display:inline-block;min-width:19px;border-radius:40px;padding:1px 5px;background:var(--accent);color:var(--accenttext);font-weight:800;text-align:center;font-size:11px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.filters input,.filters select{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:9px;min-height:42px;padding:8px 10px}.filters input{flex:1;min-width:155px}.list-links a{display:block;font-size:12px;line-height:2;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1fr 1fr;gap:11px}.loading{opacity:.7}pre{white-space:pre-wrap;overflow-wrap:anywhere}

<body><main class="container" id="app"><div class="login"><h1>سامانه جامع دبیران</h1><p>در حال بارگذاری…</p></div></main>
<script>
'use strict';
const DB='https://bymxyxxzhhbjetgymnqt.supabase.co';
const KEY='sb_publishable_z1oXEjxfaSyj9Ib13NkrMQ_4mzZopow';
const VERSION='DABIRAN FIX 6 · 2026-10-26';
const DEPTS=['میلیتاریسم','تاریخ','جامعه‌شناسی','اقتصاد','فلسفه','فرهنگ','حقوق','مطالبات ملی'];
const app=document.getElementById('app');
const S={me:null,page:'home',kind:'directive',target:null,group:null,view:'inbox',messages:[],projects:[],forward:null,error:'',success:'',busy:false,poll:null,dept:'all',search:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=s=>String(s).replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))).replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c)));
const stamp=s=>s?new Date(s).toLocaleString('fa-IR',{dateStyle:'short',timeStyle:'short'}):'';
const base=i=>3+12*i;
const deopt=i=>DEPTS[i];
function who(code){code=Number(code);if(!Number.isInteger(code)||code<1||code>98)return null;if(code===1)return {code,role:'president',label:'رئیس پژوهشکده',dept:'مرکزی'};if(code===2)return {code,role:'pr',label:'مدیریت روابط عمومی',dept:'مرکزی'};let group=Math.floor((code-3)/12),offset=(code-3)%12;return {code,group,offset,role:offset===0?'secretary':offset===1?'deputy':'member',label:offset===0?(group===0?'دبیر · SS GELB':'دبیر'):offset===1?(group===0?'معاون · ارشیا':'معاون'):'عضو '+(offset-1),dept:DEPTS[group]};}
const name=code=>{const u=who(code);return u?`${u.dept} · ${u.label} (${u.code})`:`واحد ${code}`;};
function validUrl(text){try{const u=new URL(text);return ['https:','http:'].includes(u.protocol)?u.href:null;}catch{return null;}}
function safeLink(url,label){const href=validUrl(url);return href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label??href)}</a>`:'';}
function message(text,bad=false){S.error=bad?text:'';S.success=bad?'':text;}
function errorText(error){if(error?.code==='42501')return 'دسترسی پایگاه داده رد شد (RLS/GRANT). فایل SUPABASE_FIX.sql را اجرا کن. '+error.message;return error?.message||String(error);}
async function http(table,options={}){
 const url=new URL(DB+'/rest/v1/'+table);for(const [k,v] of Object.entries(options.params||{})){url.searchParams.set(k,String(v));}
 let response;try{response=await fetch(url,{method:options.method||'GET',headers:{apikey:KEY,...(options.data===undefined?{}:{'Content-Type':'application/json'}),...(options.headers||{})},body:options.data===undefined?undefined:JSON.stringify(options.data),cache:'no-store'});}catch(e){throw Error('ارتباط با سرور برقرار نشد: '+e.message);}
 const body=await response.text();let data;try{data=body?JSON.parse(body):null;}catch{data=body;}
 if(!response.ok){const msg=(data&&typeof data==='object'&&(data.message||data.error||data.hint))||body||response.statusText;const err=new Error(`HTTP ${response.status}: ${msg}`);err.code=data?.code;throw err;}
 return data;
}
const get=(table,params)=>http(table,{params});
const insert=(table,data)=>http(table,{method:'POST',data,headers:{Prefer:'return=representation'}});
const patch=(table,params,data)=>http(table,{method:'PATCH',params,data,headers:{Prefer:'return=representation'}});
function roleTheme(){document.body.className=S.me?.role==='president'?'gold':S.me?.role==='pr'?'pink':'';app.className='container'+(S.me&&['president','pr'].includes(S.me.role)?' wide':'');}
function note(){return S.error?`<div class="notice error" role="alert">${esc(S.error)}</div>`:S.success?`<div class="notice" role="status">${esc(S.success)}</div>`:'';}
function login(){return `<div class="login"><h1>سامانه جامع دبیران</h1><p>کد واحد را وارد کنید</p><form id="login"><div class="field"><input class="pin" type="text" name="pin" inputmode="numeric" pattern="[0-9۰-۹٠-٩]+" maxlength="3" autocomplete="off" autofocus placeholder="۱ تا ۹۸" required aria-label="کد واحد"></div><button class="btn block" type="submit">ورود</button></form>${note()}<div class="diag">${VERSION}</div></div>`;}
function head(){return `<div class="top"><div><h1>${esc(S.me.role==='president'?'ریاست پژوهشکده':S.me.role==='pr'?'مدیریت روابط عمومی':'دبیرخانه '+S.me.dept)}</h1><small>${esc(S.me.label)} · کد ${S.me.code}</small></div><div class="bar"><button class="btn alt tiny" data-action="refresh">↻ به‌روزرسانی</button><button class="btn alt tiny" data-action="exit">خروج</button></div></div>`;}
function tile(label,action,kind,sub){const count=kind?S.messages.filter(m=>m.kind===kind&&m.receiver_code===S.me.code&&!m.read_at).length:0;return `<button class="tile" data-action="${action}" ${kind?`data-kind="${kind}"`:''}><b>${esc(label)} ${count?`<span class="badge">${count}</span>`:''}</b>${sub?`<small>${esc(sub)}</small>`:''}</button>`;}
function deptPanel(){return `<div class="groups">${DEPTS.map((d,i)=>`<section class="panel group"><div><h3>${esc(d)}</h3><small>دبیر: ${base(i)} · معاون: ${base(i)+1}</small></div><div class="buttons"><button data-action="compose" data-kind="directive" data-target="${base(i)}">ابلاغ به دبیر</button><button data-action="inbox" data-kind="report" data-group="${i}">گزارش‌های دبیر</button></div></section>`).join('')}</div>`;}
function home(){const r=S.me.role;let result=head()+note();if(r==='president'){result+=`<div class="section">دسترسی کامل ریاست</div><div class="tiles two">${tile('همه ابلاغیه‌ها','all','directive')}${tile('همه گزارش‌ها','all','report')}${tile('ابلاغ به هر واحد','compose','directive')}${tile('همه پروژه‌ها','projects',null)}${tile('همه ۹۸ جایگاه','units',null)}</div><div class="section">گزارش‌های اخیر</div>`+cards(S.messages.filter(m=>m.kind==='report').slice(0,6));}
else if(r==='pr'){result+=`<div class="tiles two">${tile('ابلاغیه‌های رئیس','inbox','directive')}${tile('گزارش به رئیس','compose',null)}</div><div class="section">دبیرخانه‌ها</div>`+deptPanel();}
else if(r==='secretary'){result+=`<div class="tiles two">${tile('ابلاغیه‌های روابط عمومی','inbox','directive')}${tile('گزارش به روابط عمومی','compose',null)}${tile('ابلاغ به معاون','compose','directive')}${tile('گزارش‌های معاون و اعضا','inbox','report')}</div>`;}
else if(r==='deputy'){result+=`<div class="tiles two">${tile('ابلاغیه‌های دبیر','inbox','directive')}${tile('گزارش به دبیر','compose',null)}${tile('ابلاغ به اعضا','compose','directive')}${tile('گزارش اعضا','inbox','report')}</div>`;}
else {result+=`<div class="tiles">${tile('ابلاغیه‌ها','inbox','directive')}${tile('نوشتن گزارش','compose',null)}</div>`;}
return result+`<div class="diag">صندوق‌ها آنلاین هستند و روی دستگاه‌های مختلف همگام می‌شوند · ${VERSION}</div>`;}
function availableTargets(kind){const u=S.me;if(kind==='report'){if(u.role==='pr')return [1];if(u.role==='secretary')return [2];if(u.role==='deputy')return [base(u.group)];if(u.role==='member')return [base(u.group)+1];return [];}
if(u.role==='president')return Array.from({length:97},(_,i)=>i+2);
if(u.role==='pr')return DEPTS.map((_,i)=>base(i));
if(u.role==='secretary')return [base(u.group)+1];
if(u.role==='deputy')return Array.from({length:10},(_,i)=>base(u.group)+2+i);
return [];}
function compose(){const kind=S.kind,receivers=availableTargets(kind);let target=S.target&&receivers.includes(Number(S.target))?Number(S.target):receivers[0];if(!receivers.length)return head()+`<div class="empty">این نقش امکان ارسال ${kind==='report'?'گزارش':'ابلاغیه'} ندارد.</div>`;
const f=S.forward;return head()+`<div class="bar" style="margin-bottom:15px"><button data-action="home" class="btn alt tiny">بازگشت</button></div><h2>${kind==='report'?'نوشتن گزارش':'صدور ابلاغیه'}</h2>${note()}<form id="compose" class="panel"><div class="field"><label>گیرنده</label><select name="receiver" required>${receivers.map(code=>`<option value="${code}" ${code===target?'selected':''}>${esc(name(code))}</option>`).join('')}</select></div><div class="field"><label>عنوان</label><input name="title" required maxlength="250" value="${esc(f?('ارجاع: '+f.title):'')}" placeholder="عنوان کوتاه"></div><div class="field"><label>متن ${kind==='report'?'گزارش':'ابلاغیه'}</label><textarea name="body" required placeholder="متن را اینجا بنویسید…">${esc(f?`گزارش ارجاعی از ${name(f.sender_code)}:\n\n${f.body}`:'')}</textarea></div><div class="field"><label>لینک‌ها (هر لینک یک خط)</label><textarea name="links" rows="3" style="min-height:90px" placeholder="https://t.me/…">${esc(f?(f.links||[]).join('\n'):'')}</textarea></div><div class="field"><label>عکس یا فایل (اختیاری)</label><input type="file" name="files" multiple><div class="mutednote">تا ۲۵ مگابایت برای هر فایل. پیوست‌ها در فضای عمومی آزمایشی ذخیره می‌شوند.</div></div><div class="notice error" data-error role="alert" style="display:none"></div><button class="btn block" type="submit">${kind==='report'?'ارسال گزارش':'ارسال ابلاغیه'}</button></form>`;}
function accessibleMessages(){const u=S.me;if(u.role==='president')return S.messages;if(u.role==='secretary')return S.messages.filter(m=>m.receiver_code===u.code||(m.receiver_code===u.code+1&&m.kind==='report'));return S.messages.filter(m=>m.receiver_code===u.code);}
function shown(){let items=accessibleMessages().filter(m=>m.kind===S.kind);
if(S.me.role==='pr'&&S.group!=null)items=items.filter(m=>m.sender_code===base(S.group));
if(S.me.role==='secretary'&&S.kind==='directive')items=items.filter(m=>m.sender_code===2||m.sender_code===1);
if(S.me.role==='deputy'&&S.kind==='directive')items=items.filter(m=>m.sender_code===base(S.me.group)||m.sender_code===1);
if(S.me.role==='member'&&S.kind==='directive')items=items.filter(m=>m.sender_code===base(S.me.group)+1||m.sender_code===1);
if(S.dept!=='all')items=items.filter(m=>{const b=base(Number(S.dept));return [m.sender_code,m.receiver_code].some(n=>n>=b&&n<=b+11)});
if(S.search.trim())items=items.filter(m=>[m.title,m.body,name(m.sender_code),name(m.receiver_code)].join(' ').toLowerCase().includes(S.search.toLowerCase()));return items;}
function cards(items){if(!items.length)return '<div class="empty">صندوق خالی است.</div>';return items.map(m=>{
 const canMark=m.receiver_code===S.me.code&&!m.read_at;const nextTarget=S.me.role==='deputy'?base(S.me.group):S.me.role==='secretary'?2:S.me.role==='pr'?1:null;
 const canForward=m.kind==='report'&&nextTarget&&((S.me.role==='deputy'&&m.sender_code>=base(S.me.group)+2&&m.sender_code<=base(S.me.group)+11)||(S.me.role==='secretary'&&m.sender_code>=base(S.me.group)+1&&m.sender_code<=base(S.me.group)+11)||(S.me.role==='pr'&&m.sender_code>=3&&(m.sender_code-3)%12===0));
 return `<article class="card"><div class="card-header"><div><h3>${esc(m.title||'بدون عنوان')}</h3><div class="meta">از: ${esc(name(m.sender_code))}<br>به: ${esc(name(m.receiver_code))}<br>${esc(stamp(m.created_at))}${m.parent_id?' · ارجاع از پیام #'+esc(m.parent_id):''}</div></div><span class="chip">${m.kind==='report'?'گزارش':'ابلاغیه'}${m.read_at?' · خوانده‌شده':' · جدید'}</span></div><div class="bodytext">${esc(m.body)}</div>${(m.links||[]).length?`<div class="list-links">${m.links.map(url=>safeLink(url)).join('')}</div>`:''}${(m.attachments||[]).length?`<div class="filelist">${m.attachments.map((path,i)=>safeLink(fileUrl(path),`📎 فایل ${i+1}`)).join('')}</div>`:''}<div class="actions">${canMark?`<button class="btn alt tiny" data-action="read" data-id="${m.id}">تأیید دریافت</button>`:''}${canForward?`<button class="btn tiny" data-action="forward" data-id="${m.id}">ارجاع گزارش به ${S.me.role==='deputy'?'دبیر':S.me.role==='secretary'?'روابط عمومی':'رئیس'}</button>`:''}</div></article>`;
 }).join('');}
function fileUrl(path){if(typeof path!=='string')return '';if(path.startsWith('sb://'))path=path.slice(5);if(validUrl(path))return path;return DB+'/storage/v1/object/public/dabiran_attachments/'+path.split('/').map(encodeURIComponent).join('/');}
function inbox(){return head()+`<button class="btn alt tiny" data-action="home" style="margin-bottom:16px">بازگشت</button><h2>${S.kind==='report'?'صندوق گزارش‌ها':'صندوق ابلاغیه‌ها'}</h2>${note()}${S.me.role==='president'?`<div class="filters"><select data-filter="dept"><option value="all">همه دبیرخانه‌ها</option>${DEPTS.map((d,i)=>`<option value="${i}" ${S.dept===String(i)?'selected':''}>${esc(d)}</option>`).join('')}</select><input data-filter="search" placeholder="جستجوی گزارش / واحد…" value="${esc(S.search)}"></div>`:''}<div id="message-list">${cards(shown())}</div>`;}
function allUnits(){return head()+`<button class="btn alt tiny" data-action="home" style="margin-bottom:15px">بازگشت</button><h2>تمام ۹۸ جایگاه</h2>${DEPTS.map((d,i)=>`<section class="panel"><h3>${esc(d)}</h3><p class="mutednote">دبیر: ${base(i)} · معاون: ${base(i)+1} · اعضا: ${base(i)+2} تا ${base(i)+11}</p></section>`).join('')}`;}
function projects(){return head()+`<button class="btn alt tiny" data-action="home">بازگشت</button><h2 style="margin-top:15px">پروژه‌های کل پژوهشکده</h2>${note()}<button class="btn alt" data-action="newproject" style="margin-bottom:14px">+ ثبت پروژه جدید</button>${S.projects.length?S.projects.map(p=>`<article class="card"><h3>${esc(p.title)}</h3><div class="meta">${esc(name(p.assigned_to))} · ${esc(p.department)}${p.due_date?' · مهلت: '+esc(p.due_date):''}</div><div class="bodytext">${esc(p.description)}</div><div class="actions"><select class="select" style="width:auto;min-height:38px;font-size:13px!important" data-project="${p.id}">${['ابلاغ شده','در حال انجام','تکمیل شده','متوقف شده'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn alt tiny" data-action="saveproject" data-id="${p.id}">ذخیره وضعیت</button></div></article>`).join(''):'<div class="empty">هنوز پروژه‌ای ثبت نشده است.</div>'}`;}
function projectForm(){return head()+`<button class="btn alt tiny" data-action="projects">بازگشت</button><h2 style="margin-top:16px">پروژه جدید</h2>${note()}<form id="project" class="panel"><div class="field"><label>عنوان</label><input name="title" required maxlength="250"></div><div class="field"><label>مسئول</label><select name="assigned">${Array.from({length:97},(_,i)=>`<option value="${i+2}">${esc(name(i+2))}</option>`).join('')}</select></div><div class="field"><label>شرح پروژه</label><textarea name="description" required></textarea></div><div class="field"><label>مهلت (اختیاری)</label><input type="date" name="due"></div><button class="btn block" type="submit">ثبت پروژه و ارسال ابلاغ</button></form>`;}
function render(){roleTheme();app.innerHTML=!S.me?login():S.page==='home'?home():S.page==='compose'?compose():S.page==='inbox'?inbox():S.page==='units'?allUnits():S.page==='projects'?projects():S.page==='newproject'?projectForm():home();}
async function fetchAll(table,params){let all=[],step=500,offset=0;for(let i=0;i<30;i++){const chunk=await get(table,{...params,limit:step,offset});if(!Array.isArray(chunk))throw Error(`فرمت پاسخ ${table} نامعتبر است`);all.push(...chunk);if(chunk.length<step)break;offset+=step;}return all;}
async function load(){const me=S.me;if(!me)return;let selection='id,sender_code,receiver_code,kind,title,body,links,attachments,created_at,read_at,parent_id';
 if(me.role==='president')S.messages=await fetchAll('messages',{select:selection,order:'created_at.desc'});
 else{const receivers=me.role==='secretary'?`in.(${me.code},${me.code+1})`:`eq.${me.code}`;S.messages=await fetchAll('messages',{select:selection,receiver_code:receivers,order:'created_at.desc'});
  // Outbox is shown in the project/report history when a role changes; keep outgoing available for sender reference.
  const sent=await fetchAll('messages',{select:selection,sender_code:'eq.'+me.code,order:'created_at.desc'});
  S.messages=[...new Map([...S.messages,...sent].map(x=>[x.id,x])).values()].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));}
 if(me.role==='president')S.projects=await fetchAll('projects',{select:'*',order:'created_at.desc'});}
async function refresh(announce){try{await load();S.error='';if(announce)S.success='صندوق‌ها با سرور همگام شدند.';render();return true;}catch(e){message('اتصال به صندوق‌ها برقرار نشد: '+errorText(e),true);render();return false;}}
async function enter(code){const me=who(code);if(!me){message('کد باید بین ۱ تا ۹۸ باشد.',true);render();return;}S.me=me;S.page='home';S.error='';S.success='';render();await refresh();clearInterval(S.poll);S.poll=setInterval(()=>{if(document.visibilityState==='visible'&&!S.busy&&S.me&&['home','inbox','projects'].includes(S.page))refresh(false);},12000);}
function exit(){clearInterval(S.poll);S.me=null;S.page='home';S.messages=[];S.projects=[];S.forward=null;S.group=null;message('');render();}
async function uploadFiles(files){const result=[];for(const file of files){if(file.size>25*1024*1024)throw Error('هر فایل باید حداکثر ۲۵ مگابایت باشد.');const ext=(file.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'').slice(0,12);const path=`${S.me.code}/${crypto.randomUUID()}${ext?'.'+ext:''}`;const url=DB+'/storage/v1/object/dabiran_attachments/'+path;let r;try{r=await fetch(url,{method:'POST',headers:{apikey:KEY,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});}catch(e){throw Error('مشکل آپلود فایل: '+e.message);}if(!r.ok){const raw=await r.text();throw Error('آپلود فایل: HTTP '+r.status+' '+raw.slice(0,200));}result.push('sb://'+path);}return result;}
async function send(form){if(S.busy)return;S.busy=true;const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent='در حال ارسال…';try{
 const to=Number(form.elements.receiver.value);const title=form.elements.title.value.trim(),body=form.elements.body.value.trim();if(!title||!body)throw Error('عنوان و متن را وارد کن.');
 const links=form.elements.links.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(const link of links)if(!validUrl(link))throw Error('لینک نامعتبر است: '+link);
 const additional=await uploadFiles([...form.elements.files.files]);const attachments=[...(S.forward?.attachments||[]),...additional];
 await insert('messages',{sender_code:S.me.code,receiver_code:to,kind:S.kind,title,body,links,attachments,parent_id:S.forward?.id||null});
 S.forward=null;S.page='home';message('پیام با موفقیت در سرور ثبت شد و در صندوق گیرنده قابل دریافت است.');await load();render();
 }catch(e){message('ارسال ناموفق: '+errorText(e),true);const n=form.querySelector('[data-error]');if(n){n.style.display='block';n.textContent=S.error;}button.disabled=false;button.textContent=S.kind==='report'?'ارسال گزارش':'ارسال ابلاغیه';}finally{S.busy=false;}}
async function createProject(form){if(S.busy)return;S.busy=true;try{const to=Number(form.elements.assigned.value),title=form.elements.title.value.trim(),description=form.elements.description.value.trim();await insert('projects',{title,description,created_by:1,assigned_to:to,department:who(to)?.dept||'مرکزی',due_date:form.elements.due.value||null,status:'ابلاغ شده'});await insert('messages',{sender_code:1,receiver_code:to,kind:'directive',title:'پروژه: '+title,body:description,links:[],attachments:[]});S.page='projects';message('پروژه ثبت شد و ابلاغیه ارسال شد.');await load();render();}catch(e){message('خطا در ثبت پروژه: '+errorText(e),true);render();}finally{S.busy=false;}}
function switchPage(page){S.page=page;S.group=null;S.dept='all';S.search='';S.forward=null;message('');render();}
app.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='login'){const raw=digits(form.elements.pin.value).trim();enter(Number(raw));}else if(form.id==='compose'){send(form);}else if(form.id==='project'){createProject(form);}});
app.addEventListener('click',async e=>{const btn=e.target.closest('button[data-action]');if(!btn||S.busy)return;const action=btn.dataset.action;
try{if(action==='exit'){exit();return;}if(action==='refresh'){await refresh(true);return;}if(action==='home'){switchPage('home');return;}
if(action==='compose'){S.page='compose';S.kind=btn.dataset.kind||'report';S.target=btn.dataset.target||null;S.forward=null;message('');render();return;}
if(action==='inbox'||action==='all'){S.page='inbox';S.kind=btn.dataset.kind||'directive';S.group=btn.dataset.group==null?null:Number(btn.dataset.group);S.dept='all';S.search='';message('');await refresh(false);return;}
if(action==='units'){switchPage('units');return;}if(action==='projects'){switchPage('projects');await refresh(false);return;}if(action==='newproject'){switchPage('newproject');return;}
if(action==='read'){await patch('messages',{id:'eq.'+btn.dataset.id,receiver_code:'eq.'+S.me.code},{read_at:new Date().toISOString()});message('دریافت تأیید شد.');await refresh(false);return;}
if(action==='forward'){const m=S.messages.find(x=>x.id===Number(btn.dataset.id));if(!m)return;S.forward=m;S.kind='report';S.page='compose';S.target=null;message('');render();return;}
if(action==='saveproject'){const select=app.querySelector(`[data-project="${btn.dataset.id}"]`);await patch('projects',{id:'eq.'+btn.dataset.id},{status:select.value});message('وضعیت پروژه ذخیره شد.');await refresh(false);return;}}
catch(err){message(errorText(err),true);render();}});
app.addEventListener('input',e=>{if(e.target.matches('[data-filter="search"]')){S.search=e.target.value;const list=app.querySelector('#message-list');if(list)list.innerHTML=cards(shown());}});
app.addEventListener('change',e=>{if(e.target.matches('[data-filter="dept"]')){S.dept=e.target.value;const list=app.querySelector('#message-list');if(list)list.innerHTML=cards(shown());}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.me&&!S.busy&&['home','inbox','projects'].includes(S.page))refresh(false);});
// Disable legacy offline caches from earlier GitHub builds.
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(list=>list.forEach(reg=>{if(reg.scope.startsWith(location.origin+location.pathname.replace(/[^/]*$/,'')))reg.unregister();})).catch(()=>{});
if('caches' in window)caches.keys().then(keys=>keys.filter(k=>/dabiran|pwa/i.test(k)).forEach(k=>caches.delete(k))).catch(()=>{});
render();
</script></body></html>
