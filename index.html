<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="صندوق ابلاغیه و گزارش سامانه جامع دبیران">
  <title>سامانه جامع دبیران</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Vazirmatn,Tahoma,sans-serif;font-synthesis:none;-webkit-tap-highlight-color:transparent}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#090909;color:#f4f4f4;color-scheme:dark;--bg:#090909;--card:#171717;--input:#101010;--border:#303030;--text:#f4f4f4;--muted:#a5a5a5;--accent:#f4f4f4;--accentInk:#161616;--secondary:#242424;--positive:#9edcbe;--negative:#ff9e9e;--link:#9bc7ff}
    body.rose{background:#fff7fa;color:#3d2633;color-scheme:light;--bg:#fff7fa;--card:#fff;--input:#fff;--border:#f0d6e2;--text:#3d2633;--muted:#907787;--accent:#e273a3;--accentInk:#fff;--secondary:#fff0f5;--positive:#23795d;--negative:#bf355c;--link:#ad3b72}
    button,input,textarea,select{font-family:inherit;font-size:16px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
    .shell{max-width:600px;margin:auto;padding:24px 16px 70px;min-height:100dvh}.rose .shell{max-width:790px}
    .login{max-width:370px;margin:auto;min-height:calc(100dvh - 95px);display:flex;flex-direction:column;justify-content:center}
    .eyebrow{color:var(--muted);font-size:12px;font-weight:700;margin:0 0 8px}.login h1{font-size:27px;margin:0 0 8px;font-weight:800;line-height:1.6}h1{font-size:22px;margin:0;font-weight:800;line-height:1.6}h2{font-size:20px;margin:4px 0 18px}h3{font-size:15px;margin:0 0 7px}.sub{color:var(--muted);font-size:13px;line-height:2;margin:0 0 24px}
    .field{margin-bottom:16px}.field label{display:block;font-weight:700;font-size:13px;margin:0 0 8px}.control{display:block;width:100%;min-height:52px;padding:13px 14px;background:var(--input);border:1px solid var(--border);border-radius:12px;color:var(--text);outline:0}.control:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 13%,transparent)}.control::placeholder{color:var(--muted)}.code{font-size:30px;text-align:center;direction:ltr;font-weight:800;letter-spacing:2px}textarea.control{min-height:180px;line-height:2;resize:vertical}textarea.short{min-height:78px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;min-height:51px;padding:12px 16px;background:var(--accent);color:var(--accentInk);font-weight:800}.btn.full{width:100%}.btn.outline{background:var(--secondary);color:var(--text);border:1px solid var(--border)}.btn-small{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:10px;font-size:12px;padding:8px 12px;min-height:35px}
    .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.bar p{margin:2px 0 0;color:var(--muted);font-size:12px}.bar .btn-small{flex-shrink:0}
    .tiles{display:grid;gap:11px}.tile{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:78px;text-align:right;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:18px 17px;color:var(--text)}.tile:hover,.group-actions button:hover{background:var(--secondary)}.tile b{display:block;font-size:15px}.tile small{color:var(--muted);font-size:11px}.arrow{color:var(--muted);font-size:20px;flex-shrink:0}
    .grp-list{display:grid;gap:10px}.group{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px}.group-title{font-weight:800;font-size:15px;margin-bottom:10px}.group-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.group-actions button{min-height:46px;background:var(--secondary);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 5px;font-size:12px;font-weight:700}
    .section{margin:24px 0 13px;font-size:13px;font-weight:800}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:16px;margin-bottom:10px;overflow-wrap:anywhere}.card p{font-size:14px;white-space:pre-wrap;line-height:2.05;margin:10px 0}.meta{font-size:11px;color:var(--muted);line-height:1.9}.badge{font-size:10px;display:inline-block;border-radius:6px;padding:3px 7px;background:var(--secondary);color:var(--muted)}.card-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.card-actions .btn{min-height:38px;font-size:12px}.empty{padding:40px 14px;background:var(--card);border:1px dashed var(--border);color:var(--muted);border-radius:14px;text-align:center;font-size:13px;line-height:2}
    .compose{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:18px}.compose .control{background:var(--bg)}.help{font-size:11px;color:var(--muted);line-height:2;margin:7px 0}.notice{border:1px solid var(--border);border-radius:11px;background:var(--card);font-size:12px;line-height:2;padding:12px;margin:15px 0;color:var(--positive)}.notice.bad{color:var(--negative)}.back{margin:0 0 22px}.file{display:inline-block;margin:6px 0 0 6px;font-size:12px;color:var(--link);background:var(--secondary);border:1px solid var(--border);border-radius:8px;padding:7px 10px;text-decoration:none}.file:hover{text-decoration:underline}.foot{margin:24px 0 0;text-align:center;color:var(--muted);font-size:11px;line-height:2}.links a{color:var(--link);font-size:12px;display:block;overflow-wrap:anywhere;line-height:2}.loading{opacity:.7}.two{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
    @media(min-width:720px){.shell{padding-top:44px}.group{display:flex;align-items:center;justify-content:space-between}.group-title{margin-bottom:0}.group-actions{min-width:365px}}
    @media(max-width:350px){.group-actions button{font-size:11px}.shell{padding-right:12px;padding-left:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>

<body><main id="app" class="shell"><div class="login"><h1>سامانه جامع دبیران</h1><p class="sub">در حال آماده‌سازی...</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL='https://bymxyxxzhhbjetgymnqt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_z1oXEjxfaSyj9Ib13NkrMQ_4mzZopow';
const db=window.supabase?.createClient?.(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}) || null;
const DEPTS=['میلیتاریسم','تاریخ','جامعه‌شناسی','اقتصاد','فلسفه','فرهنگ','حقوق','مطالبات ملی'];
const app=document.getElementById('app');
const state={stage:'code',enteredCode:null,me:null,page:'home',kind:null,inboxKind:null,inboxSender:null,target:null,selectedDept:null,list:[],message:null,notice:'',noticeBad:false,busy:false,session:null,poll:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faDigits=s=>String(s??'').replace(/[۰-۹]/g,x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x)).replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).trim();
const dt=v=>v?new Date(v).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'}):'—';
const codeBase=i=>3+12*i;
const roleInfo=code=>{if(code===1)return {code,role:'president',dept:null,name:'رئیس پژوهشکده'};if(code===2)return {code,role:'pr',dept:null,name:'مدیریت روابط عمومی'};if(!Number.isInteger(code)||code<3||code>98)return null;const idx=Math.floor((code-3)/12),pos=(code-3)%12;return {code,dept:DEPTS[idx],idx,role:pos===0?'secretary':pos===1?'deputy':'member',name:pos===0?(idx===0?'SS GELB':`دبیر ${DEPTS[idx]}`):pos===1?(idx===0?'ارشیا':`معاون ${DEPTS[idx]}`):`عضو ${pos-1} ${DEPTS[idx]}`};};
const nameOf=c=>roleInfo(Number(c))?.name||`کد ${c}`;
const webUrl=str=>{try{const u=new URL(str);return /^(https?:)$/.test(u.protocol)?u.href:null}catch{return null}};
function toast(msg,bad=false){state.notice=msg;state.noticeBad=bad;}
function noticeHtml(){return state.notice?`<div role="status" class="notice ${state.noticeBad?'bad':''}">${esc(state.notice)}</div>`:'';}
function htmlLogin(){document.body.classList.remove('rose');if(state.stage==='code')return `<section class="login"><p class="eyebrow">پژوهشکده</p><h1>سامانه جامع دبیران</h1><p class="sub">کد واحد خود را وارد کنید.</p><form id="codeForm"><div class="field"><input class="control code" name="code" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="کد واحد" required autofocus></div><button class="btn full" type="submit">ورود</button></form>${noticeHtml()}</section>`;
 const a=roleInfo(state.enteredCode);return `<section class="login"><p class="eyebrow">کد ${state.enteredCode}</p><h1>${esc(a?.name||'ورود')}</h1><p class="sub">برای امنیت صندوق‌ها، بار اول با ایمیل و رمز حساب همین واحد وارد شوید. پس از آن، نشست ورود روی این دستگاه حفظ می‌شود.</p><form id="authForm"><div class="field"><label>ایمیل حساب</label><input class="control" type="email" name="email" autocomplete="username" placeholder="name@example.com" required></div><div class="field"><label>رمز عبور</label><input class="control" type="password" name="password" autocomplete="current-password" required></div><button class="btn full" type="submit" ${state.busy?'disabled':''}>${state.busy?'در حال بررسی...':'ورود امن'}</button></form><button class="btn outline full" type="button" data-action="code" style="margin-top:9px">بازگشت</button>${noticeHtml()}</section>`;}
function shellHeader(){const a=state.me;return `<header class="bar"><div><h1>${a.role==='pr'?'مدیریت روابط عمومی':a.dept}</h1><p>${esc(a.role==='pr'?'ستاد مرکزی':`${a.name} · کد ${a.code}`)}</p></div><button class="btn-small" data-action="logout">خروج</button></header>`;}
function tile(title,subtitle,action,params=''){return `<button class="tile" data-action="${action}" ${params}><span><b>${esc(title)}</b>${subtitle?`<small>${esc(subtitle)}</small>`:''}</span><span class="arrow">‹</span></button>`;}
function dashboard(){const a=state.me;let out=shellHeader()+noticeHtml();if(a.role==='pr'){
 out+=`<p class="section">ارتباط با رئیس</p><div class="tiles">`+tile('ابلاغیه‌های رئیس','صندوق ورودی','inbox','data-kind="directive" data-sender="1"')+tile('گزارش به رئیس','ارسال گزارش','compose','data-kind="report" data-target="1"')+`</div><p class="section">دبیرخانه‌ها</p><div class="grp-list">`;
 DEPTS.forEach((name,i)=>{const code=codeBase(i);out+=`<div class="group"><div class="group-title">${name}</div><div class="group-actions"><button data-action="compose" data-kind="directive" data-target="${code}">ابلاغ به دبیر</button><button data-action="inbox" data-kind="report" data-sender="${code}">گزارش‌های دبیر</button></div></div>`});out+=`</div>`;
 }else{const i=a.idx,b=codeBase(i);const actions=a.role==='secretary'?[['ابلاغیه‌های روابط عمومی','inbox','directive',2],['گزارش به روابط عمومی','compose','report',2],['ابلاغ به معاون','compose','directive',b+1],['گزارش‌های معاون و اعضا','inbox','report',b+1]]:a.role==='deputy'?[['ابلاغیه‌های دبیر','inbox','directive',b],['گزارش به دبیر','compose','report',b],['ابلاغ به اعضا','compose','directive','members'],['گزارش اعضا','inbox','report','members']]:[['ابلاغیه‌ها','inbox','directive',b+1],['نوشتن گزارش','compose','report',b+1]];
 out+=`<div class="tiles">`+actions.map(([title,action,kind,v])=>tile(title,'',action,`data-kind="${kind}" ${action==='inbox'?'data-sender':'data-target'}="${v}"`)).join('')+`</div>`;}
 out+=`<p class="foot">صندوق‌های آنلاین · ذخیره مشترک · GitHub Pages + Supabase</p>`;return out;}
function btnBack(){return `<button type="button" class="btn-small back" data-action="home">بازگشت</button>`;}
function showInbox(){const a=state.me;let source=state.inboxSender;const title=state.inboxKind==='directive'?'ابلاغیه‌ها':'گزارش‌ها';let msgs=state.list.filter(m=>m.kind===state.inboxKind&&m.receiver_code===a.code);if(source==='members'){const b=codeBase(a.idx);msgs=msgs.filter(m=>m.sender_code>=b+2&&m.sender_code<=b+11)}else if(source)msgs=msgs.filter(m=>m.sender_code===Number(source));
 let s=shellHeader()+btnBack()+`<h2>${title}</h2>`+noticeHtml();if(!msgs.length)return s+`<div class="empty">هنوز پیامی در این صندوق نیست.</div>`;
 for(const m of msgs){let links=(m.links||[]).map(u=>webUrl(u)?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`:'').join('');const attached=(m.attachments||[]).map((u,i)=>`<button type="button" class="file" data-action="attachment" data-id="${m.id}" data-file="${i}">پیوست ${i+1}</button>`).join('');s+=`<article class="card"><span class="badge">${m.read_at?'دیده‌شده':'جدید'}</span><h3>${esc(m.title||'بدون عنوان')}</h3><div class="meta">از ${esc(nameOf(m.sender_code))} · ${dt(m.created_at)}</div><p>${esc(m.body)}</p><div class="links">${links}</div><div>${attached}</div><div class="card-actions">${!m.read_at?`<button class="btn outline" data-action="read" data-id="${m.id}">تأیید دریافت</button>`:''}${m.kind==='report'&&(a.role==='deputy'||a.role==='secretary')?`<button class="btn outline" data-action="forward" data-id="${m.id}">ارسال به مسئول بالاتر</button>`:''}</div></article>`;}
 return s;}
function showCompose(){const a=state.me,kind=state.kind,isDirective=kind==='directive',target=state.target;const title=isDirective?'ابلاغ جدید':'نوشتن گزارش';let opt='';if(target==='members'){const b=codeBase(a.idx);for(let c=b+2;c<=b+11;c++)opt+=`<option value="${c}">${esc(nameOf(c))} · کد ${c}</option>`;}
 const forward=state.message;return shellHeader()+btnBack()+`<h2>${title}</h2>`+noticeHtml()+`<form id="composeForm" class="compose"><div class="field"><label>گیرنده</label>${target==='members'?`<select class="control" name="receiver" required>${opt}</select>`:`<div class="control" style="min-height:48px">${esc(nameOf(Number(target)))}</div>`}</div><div class="field"><label>عنوان</label><input class="control" name="title" required placeholder="عنوان کوتاه" value="${esc(forward?`ارجاع گزارش: ${forward.title}`:'')}"></div><div class="field"><label>متن</label><textarea class="control" name="body" required placeholder="متن را اینجا بنویسید...">${esc(forward?`گزارش دریافتی از ${nameOf(forward.sender_code)}:\n\n${forward.body}`:'')}</textarea></div><div class="field"><label>لینک‌ها (هر لینک در یک خط)</label><textarea class="control short" name="links" placeholder="https://t.me/...">${esc((forward?.links||[]).join('\n'))}</textarea></div><div class="field"><label>افزودن عکس یا فایل (اختیاری)</label><input class="control" type="file" name="files" multiple><p class="help">آپلود فایل پس از فعال‌کردن Storage انجام می‌شود. تا آن زمان می‌توانی لینک عکس یا فایل را بالا وارد کنی.</p></div><button class="btn full" type="submit" ${state.busy?'disabled':''}>${state.busy?'در حال ارسال...':isDirective?'ارسال ابلاغیه':'ارسال گزارش'}</button></form>`;}
function render(){app.innerHTML=!state.me?htmlLogin():state.page==='home'?dashboard():state.page==='inbox'?showInbox():showCompose();}
async function getUnit(user){const {data,error}=await db.from('units').select('code,department,role,title').eq('user_id',user.id).maybeSingle();if(error)throw error;return data;}
async function validateSession(code,session){const info=roleInfo(code);if(!session?.user)return false;const unit=await getUnit(session.user);if(!unit){toast('این حساب هنوز به هیچ کد واحدی متصل نشده است.',true);return false;}if(unit.code!==code){toast(`این حساب متعلق به کد ${unit.code} است، نه کد ${code}.`,true);return false;}state.me=info;state.session=session;state.stage='code';document.body.classList.toggle('rose',code===2);await loadInbox();return true;}
async function loadInbox(){if(!state.me)return;const {data,error}=await db.from('messages').select('id,sender_code,receiver_code,kind,title,body,links,attachments,created_at,read_at').eq('receiver_code',state.me.code).order('created_at',{ascending:false}).limit(500);if(error)throw error;state.list=data||[];}
async function submitCode(code){if(code===1){toast('پنل رئیس فعلاً فعال نیست.',true);render();return;}if(!roleInfo(code)){toast('کد واحد باید بین ۱ تا ۹۸ باشد.',true);render();return;}state.enteredCode=code;state.notice='';if(!db){toast('اتصال سرویس بارگذاری نشده است. اینترنت خود را بررسی کن.',true);render();return;}
 try{const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(session&&await validateSession(code,session)){state.page='home';toast('');startPolling();render();return;}state.stage='auth';render();}
 catch(e){state.stage='auth';toast('بررسی حساب ممکن نشد. اینترنت را بررسی کن.',true);render();}}
async function login(email,password){state.busy=true;render();try{const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;const good=await validateSession(state.enteredCode,data.session);if(!good){await db.auth.signOut();state.stage='auth';render();return;}state.page='home';toast('');startPolling();render();}catch(e){toast(`ورود انجام نشد: ${e.message||'ایمیل یا رمز نادرست است.'}`,true);render();}finally{state.busy=false;}}
function startPolling(){clearInterval(state.poll);state.poll=setInterval(async()=>{if(!state.me||document.hidden||state.busy)return;try{await loadInbox();if(state.page==='inbox')render()}catch{}},12000);}
async function logout(){clearInterval(state.poll);try{await db?.auth.signOut()}catch{}state.me=null;state.session=null;state.enteredCode=null;state.stage='code';state.page='home';state.list=[];state.message=null;state.notice='';document.body.classList.remove('rose');render();}
async function markRead(id){const {error}=await db.from('messages').update({read_at:new Date().toISOString()}).eq('id',Number(id)).eq('receiver_code',state.me.code);if(error){toast('تأیید دریافت ذخیره نشد.',true);}else{toast('دریافت پیام ثبت شد.');await loadInbox();}render();}
async function openAttachment(id,index){const m=state.list.find(x=>x.id===Number(id)),file=m?.attachments?.[index];if(!file)return;if(file.startsWith('sb://')){const path=file.slice(5),{data,error}=await db.storage.from('dabiran_attachments').createSignedUrl(path,90);if(error)throw error;window.open(data.signedUrl,'_blank','noopener,noreferrer');}else{const u=webUrl(file);if(u)window.open(u,'_blank','noopener,noreferrer');}}
async function send(form){if(state.busy)return;const a=state.me;const to=state.target==='members'?Number(form.elements.receiver.value):Number(state.target);const title=form.elements.title.value.trim(),body=form.elements.body.value.trim();const links=form.elements.links.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 if(!title||!body){toast('عنوان و متن را وارد کن.',true);render();return;}if(links.some(x=>!webUrl(x))){toast('هر لینک باید با https:// یا http:// شروع شود.',true);const t=document.createElement('div');t.className='notice bad';t.textContent=state.notice;form.prepend(t);return;}
 state.busy=true;const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent='در حال ارسال...';try{
 const attachments=(state.message?.attachments||[]).slice();const files=Array.from(form.elements.files.files||[]);
 for(const file of files){const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10)||'bin';const path=`${a.code}/${to}/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('dabiran_attachments').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(error)throw Error('بارگذاری فایل انجام نشد؛ Storage هنوز فعال نیست یا ظرفیت سرویس کافی نیست. می‌توانی به‌جای فایل، لینک آن را ثبت کنی.');attachments.push(`sb://${path}`);}
 const payload={sender_code:a.code,receiver_code:to,kind:state.kind,title,body,links,attachments};const {error}=await db.from('messages').insert(payload);if(error)throw error;state.page='home';state.message=null;toast('پیام در پایگاه داده ثبت و به صندوق گیرنده ارسال شد.');await loadInbox();render();
 }catch(e){toast(`ارسال ناموفق بود: ${e.message||'خطا در ارتباط با پایگاه داده'}`,true);const n=document.createElement('div');n.className='notice bad';n.textContent=state.notice;form.prepend(n);}finally{state.busy=false;button.disabled=false;button.textContent=state.kind==='directive'?'ارسال ابلاغیه':'ارسال گزارش';}}
app.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;if(form.id==='codeForm'){const v=faDigits(form.elements.code.value);if(!/^\d{1,3}$/.test(v)){toast('کد معتبر نیست.',true);render();return;}await submitCode(Number(v));}else if(form.id==='authForm'){await login(form.elements.email.value.trim(),form.elements.password.value);}else if(form.id==='composeForm'){await send(form);}});
app.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;try{if(action==='code'){state.stage='code';state.notice='';render();return;}if(action==='logout'){await logout();return;}if(action==='home'){state.page='home';state.notice='';state.message=null;render();return;}if(action==='inbox'){state.page='inbox';state.inboxKind=b.dataset.kind;state.inboxSender=b.dataset.sender;state.notice='';await loadInbox();render();return;}if(action==='compose'){state.page='compose';state.kind=b.dataset.kind;state.target=b.dataset.target;state.message=null;state.notice='';render();return;}if(action==='read'){await markRead(b.dataset.id);return;}if(action==='attachment'){await openAttachment(b.dataset.id,Number(b.dataset.file));return;}if(action==='forward'){const m=state.list.find(x=>x.id===Number(b.dataset.id));if(!m)return;state.message=m;state.page='compose';state.kind='report';state.target=state.me.role==='deputy'?codeBase(state.me.idx):state.me.role==='secretary'?'2':null;state.notice='';render();return;}}catch(err){toast(`عملیات انجام نشد: ${err.message}`,true);render();}});
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&state.me)try{await loadInbox();if(state.page==='inbox')render()}catch{}});
render();
</script>
