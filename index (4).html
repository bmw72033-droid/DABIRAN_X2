<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0c">
<meta name="description" content="سامانه سبک و یکپارچه ابلاغیه‌ها و گزارش‌های پژوهشکده">
<title>سامانه دبیرخانه‌ها | پژوهشکده</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Vazirmatn,Tahoma,Arial,sans-serif;font-synthesis:none}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Vazirmatn,Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{cursor:not-allowed;opacity:.6}a{color:inherit}input,select,textarea{font-size:16px}::selection{background:var(--accent);color:var(--accent-text)}
body[data-theme="dark"]{--bg:#090a0c;--surface:#151619;--surface-hover:#1d1f23;--ink:#f7f7f7;--muted:#979a9f;--line:#292b30;--accent:#f1f1f2;--accent-text:#101113;--subtle:#202227;--success:#9ee5ba;--error:#ff9c9c;--tag:#c5c9ce;color-scheme:dark}
body[data-theme="rose"]{--bg:#fff8fb;--surface:#ffffff;--surface-hover:#fff0f6;--ink:#3c2734;--muted:#8e7481;--line:#eedbe5;--accent:#e872a5;--accent-text:#ffffff;--subtle:#faeaf1;--success:#177650;--error:#b32c56;--tag:#a7376a;color-scheme:light}
body{background:var(--bg);color:var(--ink);min-height:100vh;transition:background .16s ease,color .16s ease}#app{min-height:100dvh}.shell{width:min(100% - 32px,650px);margin:auto;padding:30px 0 70px}.shell.wide{width:min(100% - 32px,820px)}.kicker{color:var(--muted);font-size:12px;letter-spacing:.1px;font-weight:600}.page-title{font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.65;letter-spacing:-.8px;margin:3px 0 0}.subtitle{font-size:13px;color:var(--muted);line-height:1.9;margin:4px 0 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}.top-name{min-width:0}.top .page-title{font-size:23px}.btn-link{appearance:none;background:transparent;border:1px solid var(--line);padding:9px 13px;border-radius:12px;color:var(--muted);white-space:nowrap;font-size:12px}.btn-link:hover{color:var(--ink);border-color:var(--muted)}.muted{color:var(--muted)}.login{min-height:calc(100dvh - 80px);display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:auto}.login .page-title{font-size:30px}.login-header{margin-bottom:30px}.seg{display:flex;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:16px;margin-bottom:25px;gap:5px}.seg button{border:0;border-radius:11px;background:transparent;color:var(--muted);flex:1;padding:12px 4px;font-size:13px;font-weight:700}.seg button.active{background:var(--accent);color:var(--accent-text);box-shadow:0 2px 9px #0000000b}.field{margin-bottom:19px}.field>label{display:block;margin-bottom:9px;font-size:13px;font-weight:700}.input{width:100%;min-height:51px;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--surface);color:var(--ink);outline:none}.input:focus{border-color:var(--accent)}.input::placeholder{color:var(--muted);opacity:.8}textarea.input{min-height:155px;resize:vertical;line-height:1.95}.code{text-align:center;letter-spacing:7px;font-weight:800;font-size:27px;direction:ltr}.button{background:var(--accent);color:var(--accent-text);border:0;border-radius:14px;padding:13px 17px;min-height:52px;font-weight:800}.button:active,.tile:active{transform:scale(.992)}.button.full{width:100%}.button.outline{background:transparent;color:var(--ink);border:1px solid var(--line)}.button.outline:hover{background:var(--surface-hover)}.help{color:var(--muted);font-size:12px;line-height:2;margin:13px 0 0}.statusline{margin:17px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:12px;line-height:1.9}.statusline.error{color:var(--error)}.statusline.success{color:var(--success)}.section-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 22px}.section-header h2{font-size:19px;line-height:1.5;margin:0}.back{border:0;background:none;color:var(--muted);padding:8px 0;font-size:13px}.tiles{display:grid;gap:12px}.tile{display:flex;align-items:center;justify-content:space-between;gap:13px;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:17px;min-height:82px;padding:20px 17px;color:var(--ink);transition:background .1s}.tile:hover{background:var(--surface-hover)}.tile strong{display:block;font-size:17px;line-height:1.5;font-weight:700}.tile small{display:block;font-size:12px;margin-top:5px;color:var(--muted)}.arrow{font-family:Arial,sans-serif;color:var(--muted);font-size:25px;line-height:1}.pill{display:inline-grid;place-items:center;min-width:21px;height:21px;border-radius:99px;background:var(--subtle);padding:0 6px;font-size:11px;color:var(--tag);font-weight:800;margin-right:5px}.group-list{display:grid;gap:10px}.group-row{display:grid;grid-template-columns:1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}.group-title{font-size:16px;font-weight:800;margin:0}.group-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini{min-height:45px;border-radius:11px;border:1px solid var(--line);background:var(--subtle);color:var(--ink);font-size:12px;font-weight:700;padding:10px 8px}.mini:hover{background:var(--surface-hover)}.mini.rose{background:#fbe1ed;color:#92345f;border-color:#f5d4e3}body[data-theme="dark"] .mini.rose{background:var(--subtle);color:var(--ink);border-color:var(--line)}.notice-card{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:13px;overflow-wrap:anywhere}.notice-card h3{font-size:16px;margin:6px 0 10px;line-height:1.7}.notice-card p{white-space:pre-wrap;line-height:1.95;font-size:14px;margin:8px 0;color:var(--ink)}.meta{font-size:12px;color:var(--muted);line-height:1.75}.smalltag{font-size:11px;color:var(--tag);font-weight:700}.notice-card .bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}.tiny{font-size:12px;min-height:37px;padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:var(--subtle);color:var(--ink);font-weight:600}.tiny:hover{background:var(--surface-hover)}.tiny.ok{color:var(--success)}.empty{text-align:center;padding:45px 18px;border:1px dashed var(--line);color:var(--muted);font-size:13px;line-height:2;border-radius:18px}.form-box{background:var(--surface);border:1px solid var(--line);padding:18px;border-radius:18px}.form-box .input{background:var(--bg)}.hint-note{font-size:11px;color:var(--muted);line-height:2;margin-top:6px}.file-preview{display:grid;gap:7px;margin:11px 0}.file-chip{display:inline-flex;align-items:center;max-width:100%;border:1px solid var(--line);background:var(--subtle);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}.file-chip:hover{text-decoration:underline}.linkline{display:block;text-decoration:none;color:var(--tag);font-size:13px;margin:10px 0;overflow-wrap:anywhere}.linkline:hover{text-decoration:underline}.footer{margin:34px 0 0;font-size:11px;line-height:2;color:var(--muted);text-align:center}.divider{height:1px;background:var(--line);margin:24px 0}.central-intro{margin-bottom:20px}.central-intro .subtitle{max-width:650px}.role-summary{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:6px}.role-chip{background:var(--subtle);padding:3px 9px;border-radius:99px;font-size:11px;color:var(--tag)}.simple-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:27px}.simple-menu .tile{min-height:94px}.simple-menu .tile strong{font-size:14px}.heading{font-weight:800;font-size:16px;margin:22px 0 12px}.toolbox{border-top:1px solid var(--line);padding:20px 0 0;margin-top:32px}.toolbox summary{cursor:pointer;color:var(--muted);font-size:12px;padding:5px 0}.toolbox .toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.busy{opacity:.7;pointer-events:none}.subtle-box{padding:11px 13px;background:var(--subtle);border-radius:11px;font-size:12px;color:var(--muted);line-height:1.9;margin:0 0 18px}@media(min-width:720px){.shell{padding-top:60px}.group-row{grid-template-columns:1fr 2fr;align-items:center}.tile{min-height:90px}.group-row .group-title{font-size:17px}.login{min-height:78dvh}}@media(max-width:390px){.shell{width:calc(100% - 26px);padding-top:22px}.group-actions{gap:7px}.mini{font-size:11px}.tile{padding:18px 14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-theme="dark"><main id="app"></main>
<script>
(()=>{'use strict';
const app=document.querySelector('#app');
const STORAGE='dabiran_unified_v1';
const DEPARTMENTS=['میلیتاریسم','تاریخ','جامعه‌شناسی','اقتصاد','فلسفه','فرهنگ','حقوق','مطالعات ملی'];
const PEOPLE={ 'میلیتاریسم':{secretary:'SS GELB',deputy:'ارشیا'} };
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const date=n=>new Date(n).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'});
const cleanUrl=v=>{try{const u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const emptyDb=()=>({notices:[],reports:[]});
let db;let banner='';let bannerType='success';let loginScope='pr',loginDepartment=DEPARTMENTS[0];let current=null,view={page:'home'};let fileStorePromise;
try{db=JSON.parse(localStorage.getItem(STORAGE))||emptyDb()}catch{db=emptyDb()}
if(!Array.isArray(db.notices))db.notices=[];if(!Array.isArray(db.reports))db.reports=[];
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(db));return true}catch(e){banner='فضای ذخیره‌سازی مرورگر پر است. ابتدا از اطلاعات نسخه پشتیبان بگیرید.';bannerType='error';return false}}
function setBanner(s,type='success'){banner=s;bannerType=type}
function dbFiles(){if(fileStorePromise)return fileStorePromise;fileStorePromise=new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}const r=indexedDB.open('dabiran_unified_files',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return fileStorePromise}
async function storeFiles(files){if(!files.length)return [];const database=await dbFiles();const saved=[];for(const f of files){const id=key();await new Promise((resolve,reject)=>{const tx=database.transaction('files','readwrite');tx.objectStore('files').put({id,blob:f,name:f.name,type:f.type,size:f.size});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});saved.push({id,name:f.name,size:f.size})}return saved}
async function getFile(id){const database=await dbFiles();return new Promise((resolve,reject)=>{const tx=database.transaction('files','readonly');const req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function allFiles(){const database=await dbFiles();return new Promise((resolve,reject)=>{const tx=database.transaction('files','readonly');const req=tx.objectStore('files').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function downloadBlob(blob,filename){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function viewer(){if(!current)return '';if(current.space==='pr')return 'pr';if(current.role===3)return `member:${current.dept}:${current.name}`;return `${current.role===1?'secretary':'deputy'}:${current.dept}`}
function noticeFor(n){if(!current)return false;if(current.space==='pr')return n.to==='pr';return n.dept===current.dept&&n.to===({1:'secretary',2:'deputy',3:'member'}[current.role])}
function reportFor(r){if(!current)return false;if(current.space==='pr')return r.to==='pr'&&r.from==='secretary';if(r.dept!==current.dept)return false;if(current.role===1)return r.from==='deputy'||r.from==='member';if(current.role===2)return r.from==='member';return false}
function countUnread(items){return items.filter(x=>!x.seenBy?.includes(viewer())).length}
function roleTitle(){if(current?.space==='pr')return 'روابط عمومی';return ({1:'دبیر',2:'معاون',3:'عضو'})[current.role]}
function nameFor(){if(current.space==='pr')return 'ستاد پژوهشکده';return current.name}
function theme(t){document.body.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='rose'?'#fff8fb':'#090a0c'}
function header(){return `<header class="top"><div class="top-name"><div class="kicker">${current.space==='pr'?'پژوهشکده / ستاد مرکزی':`پژوهشکده / دبیرخانه ${esc(current.dept)}`}</div><h1 class="page-title">${current.space==='pr'?'روابط عمومی':'دبیرخانه '+esc(current.dept)}</h1><div class="role-summary"><span class="role-chip">${roleTitle()}</span><span class="subtitle">${esc(nameFor())}</span></div></div><button class="btn-link" data-action="logout">تغییر نقش</button></header>`}
function tile(text,sub,action,extra='',badge=0){return `<button class="tile" data-action="${action}" ${extra}><span><strong>${esc(text)}${badge?` <span class="pill">${badge.toLocaleString('fa-IR')}</span>`:''}</strong>${sub?`<small>${esc(sub)}</small>`:''}</span><span aria-hidden="true" class="arrow">‹</span></button>`}
function flash(){const b=banner?`<div class="statusline ${bannerType==='error'?'error':'success'}" role="status">${esc(banner)}</div>`:'';banner='';return b}
function login(){theme(loginScope==='pr'?'rose':'dark');const depOpts=DEPARTMENTS.map(d=>`<option ${d===loginDepartment?'selected':''} value="${esc(d)}">${esc(d)}</option>`).join('');app.className='shell';app.innerHTML=`<section class="login"><div class="login-header"><div class="kicker">پژوهشکده</div><h1 class="page-title">سامانه دبیرخانه‌ها</h1><p class="subtitle">فقط یک کد برای ورود به پنل خودتان.</p></div><div class="seg"><button type="button" data-scope="pr" class="${loginScope==='pr'?'active':''}">روابط عمومی</button><button type="button" data-scope="department" class="${loginScope==='department'?'active':''}">دبیرخانه‌ها</button></div><form id="loginForm">${loginScope==='department'?`<div class="field"><label for="loginDepartment">دبیرخانه</label><select class="input" id="loginDepartment" name="department">${depOpts}</select></div>`:''}<div class="field"><label for="loginCode">کد ورود</label><input class="input code" type="text" id="loginCode" name="code" autocomplete="off" inputmode="numeric" pattern="[0-9۰-۹٠-٩]*" maxlength="1" placeholder="—" autofocus required></div><div class="field" id="memberNameWrap" hidden><label for="memberName">نام شما</label><input class="input" id="memberName" name="memberName" placeholder="نام یا نام مستعار" autocomplete="off"></div><button class="button full" type="submit">ورود</button></form>${flash()}<p class="help">${loginScope==='pr'?'کد ۲: روابط عمومی  ·  کد ۱: ریاست (فعلاً غیرفعال)':'کد ۱: دبیر  ·  کد ۲: معاون  ·  کد ۳: عضو'}</p><div class="footer">نسخه آزمایشی؛ کدها رمز امنیتی نیستند و اطلاعات فقط در همین مرورگر ذخیره می‌شود.</div></section>`;const input=app.querySelector('#loginCode');input?.focus({preventScroll:true})}
function homePR(){theme('rose');app.className='shell wide';const directorNotes=countUnread(db.notices.filter(n=>n.to==='pr'&&n.from==='president'));app.innerHTML=`${header()}<div class="central-intro"><p class="subtitle">ابلاغیه‌ها و گزارش‌ها، برای هر دبیرخانه در یک جا.</p></div><div class="simple-menu">${tile('ابلاغیه‌های رئیس','صندوق دریافتی','inbox','data-box="pr-president-notices"',directorNotes)}${tile('گزارش به رئیس','نوشتن و ارسال گزارش','compose','data-kind="report" data-target="president"')}</div><h2 class="heading">دبیرخانه‌ها</h2><div class="group-list">${DEPARTMENTS.map(d=>{const unread=countUnread(db.reports.filter(r=>r.dept===d&&r.to==='pr'&&r.from==='secretary'));return `<section class="group-row"><h3 class="group-title">${esc(d)}</h3><div class="group-actions"><button class="mini rose" data-action="compose" data-kind="notice" data-target="secretary" data-dept="${esc(d)}">ابلاغ به دبیر</button><button class="mini" data-action="inbox" data-box="pr-reports" data-dept="${esc(d)}">گزارش‌های دبیر${unread?` (${unread.toLocaleString('fa-IR')})`:''}</button></div></section>`}).join('')}</div>${maintenance()}${flash()}<div class="footer">اطلاعات این نسخه فقط روی مرورگر همین دستگاه نگهداری می‌شوند.</div>`}
function homeDepartment(){theme('dark');app.className='shell';const dept=current.dept;const r=current.role;const freshNotices=countUnread(db.notices.filter(noticeFor));const reports=countUnread(db.reports.filter(reportFor));let items=[];if(r===1)items=[['ابلاغیه‌های روابط عمومی','inbox','notices',freshNotices],['گزارش به روابط عمومی','compose','report',0],['ابلاغ به معاون','compose','notice',0],['گزارش‌های معاون و اعضا','inbox','reports',reports]];if(r===2)items=[['ابلاغیه‌های دبیر','inbox','notices',freshNotices],['گزارش به دبیر','compose','report',0],['ابلاغ به اعضا','compose','notice',0],['گزارش اعضا','inbox','reports',reports]];if(r===3)items=[['ابلاغیه‌ها','inbox','notices',freshNotices],['نوشتن گزارش','compose','report',0]];app.innerHTML=header()+`<div class="tiles">${items.map(([label,action,kind,badge])=>tile(label,'',action,action==='inbox'?`data-box="department-${kind}"`:`data-kind="${kind}"`,badge)).join('')}</div>${flash()}<div class="footer">ساده، سریع، بدون مراحل اضافه</div>`}
function matchingInbox(box,dept){if(box==='pr-president-notices')return db.notices.filter(n=>n.from==='president'&&n.to==='pr');if(box==='pr-reports')return db.reports.filter(r=>r.dept===dept&&r.from==='secretary'&&r.to==='pr');if(box==='department-notices')return db.notices.filter(noticeFor);if(box==='department-reports')return db.reports.filter(reportFor);return []}
function labelsInbox(box,dept){return {'pr-president-notices':'ابلاغیه‌های رئیس','pr-reports':`گزارش‌های دبیر ${dept}`,'department-notices':current.role===1?'ابلاغیه‌های روابط عمومی':current.role===2?'ابلاغیه‌های دبیر':'ابلاغیه‌ها','department-reports':current.role===1?'گزارش‌های معاون و اعضا':'گزارش اعضا'}[box]||'صندوق'}
function isReportBox(box){return box==='pr-reports'||box==='department-reports'}
function fileLinks(files){return(files||[]).map(f=>`<button class="file-chip" data-action="getfile" data-file="${esc(f.id)}">📎 ${esc(f.name)}</button>`).join('')}
function itemCard(x,isReport){const from=x.fromName||({pr:'روابط عمومی',president:'رئیس',secretary:'دبیر',deputy:'معاون',member:'عضو'}[x.from]||'ارسال‌کننده');const links=Array.isArray(x.links)?x.links:(x.link?[x.link]:[]);const valid=links.map(cleanUrl).filter(Boolean).map(u=>`<a class="linkline" href="${esc(u)}" target="_blank" rel="noopener noreferrer">باز کردن لینک پیوست ↗</a>`).join('');const viewed=x.seenBy?.includes(viewer());const confirmed=x.ackBy?.includes(viewer());let controls=isReport?(!viewed?`<button class="tiny" data-action="markread" data-id="${esc(x.id)}" data-type="report">خواندم ✓</button>`:`<span class="smalltag">✓ مشاهده‌شده</span>`):(!confirmed?`<button class="tiny" data-action="ack" data-id="${esc(x.id)}">دریافت کردم ✓</button>`:`<span class="smalltag">✓ دریافت تأیید شد</span>`);return `<article class="notice-card"><span class="smalltag">${isReport?'گزارش':'ابلاغیه'} · ${esc(from)}</span><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p>${valid}${x.files?.length?`<div class="file-preview">${fileLinks(x.files)}</div>`:''}<div class="bottom"><span class="meta">${date(x.createdAt)}</span>${controls}</div>${!isReport&&current?.space==='department'?`<button class="tiny" style="margin-top:12px" data-action="reply" data-id="${esc(x.id)}">نوشتن گزارش این کار</button>`:''}</article>`}
function inbox(){theme(current.space==='pr'?'rose':'dark');app.className=current.space==='pr'?'shell wide':'shell';const box=view.box,dep=view.dept;const items=matchingInbox(box,dep).sort((a,b)=>b.createdAt-a.createdAt);app.innerHTML=`${header()}<div class="section-header"><h2>${esc(labelsInbox(box,dep))}</h2><button class="back" data-action="home">بازگشت ←</button></div>${items.length?items.map(x=>itemCard(x,isReportBox(box))).join(''):`<div class="empty">این صندوق فعلاً خالی است.</div>`}${flash()}`}
function compose(){theme(current.space==='pr'?'rose':'dark');app.className=current.space==='pr'?'shell wide':'shell';let dest,kind=view.kind,dept=view.dept??current.dept,fromRole=current.space==='pr'?'pr':({1:'secretary',2:'deputy',3:'member'}[current.role]);if(current.space==='pr')dest=view.target||'president';else if(kind==='notice')dest=current.role===1?'deputy':'member';else dest=current.role===1?'pr':current.role===2?'secretary':'deputy';const names={president:'رئیس پژوهشکده',pr:'روابط عمومی',secretary:`دبیر ${dept}`,deputy:`معاون ${dept}`,member:`اعضای ${dept}`};const title=kind==='notice'?'ارسال ابلاغیه':'نوشتن گزارش';const sourceItems=(current.space==='department'&&kind==='report')?db.notices.filter(noticeFor).sort((a,b)=>b.createdAt-a.createdAt):[];app.innerHTML=`${header()}<div class="section-header"><h2>${title}</h2><button class="back" data-action="home">بازگشت ←</button></div><div class="subtle-box">مقصد: <strong>${esc(names[dest])}</strong></div><form id="composeForm" class="form-box"><div class="field"><label for="title">عنوان</label><input class="input" name="title" id="title" required placeholder="عنوان کوتاه"></div>${sourceItems.length?`<div class="field"><label for="ref">مربوط به کدام ابلاغیه؟ (اختیاری)</label><select class="input" id="ref" name="ref"><option value="">بدون انتخاب</option>${sourceItems.slice(0,60).map(n=>`<option value="${esc(n.id)}" ${view.ref===n.id?'selected':''}>${esc(n.title.slice(0,75))}</option>`).join('')}</select></div>`:''}<div class="field"><label for="bodyText">${kind==='notice'?'متن ابلاغیه':'متن گزارش'}</label><textarea class="input" id="bodyText" name="body" placeholder="${kind==='notice'?'چه کاری باید انجام شود؟':'چه کاری انجام شد؟ نتیجه چه بود؟'}" required></textarea></div><div class="field"><label for="links">لینک‌ها (اختیاری)</label><textarea class="input" id="links" name="links" style="min-height:85px" placeholder="لینک تلگرام یا فایل؛ هر لینک در یک خط"></textarea></div><div class="field"><label for="attachments">عکس یا فایل (اختیاری)</label><input class="input" id="attachments" name="attachments" type="file" multiple><div class="hint-note">چند فایل می‌توانی انتخاب کنی. حجم واقعی به فضای ذخیره‌سازی دستگاه وابسته است.</div></div><button class="button full" type="submit" id="submitBtn">${kind==='notice'?'ارسال ابلاغیه':'ارسال گزارش'}</button></form>${flash()}`;app.querySelector('#title')?.focus({preventScroll:true})}
function maintenance(){return `<details class="toolbox"><summary>پشتیبان‌گیری از اطلاعات این مرورگر</summary><p class="help">برای جلوگیری از ازدست‌رفتن اطلاعات، از گزارش‌ها، ابلاغیه‌ها و پیوست‌ها نسخه پشتیبان بگیر. برای انتقال آزمایشی به مرورگر دیگر می‌توانی همان فایل را بازیابی کنی.</p><div class="toolrow"><button class="tiny" data-action="export">دریافت نسخه پشتیبان</button><button class="tiny" data-action="import">بازیابی نسخه پشتیبان</button><input id="restoreInput" type="file" accept="application/json,.json" hidden></div></details>`}
function render(){if(!current){login();return}if(view.page==='home'){if(current.space==='pr')homePR();else homeDepartment();return}if(view.page==='inbox'){inbox();return}if(view.page==='compose'){compose();return}}
function normalizeCode(s){return String(s).replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))).replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c))).trim()}
app.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;const act=button.dataset.action;if(button.dataset.scope){loginScope=button.dataset.scope;setBanner('');render();return}if(act==='logout'){current=null;view={page:'home'};setBanner('');render();return}if(act==='home'){view={page:'home'};setBanner('');render();return}if(act==='inbox'){view={page:'inbox',box:button.dataset.box,dept:button.dataset.dept??current?.dept};setBanner('');render();return}if(act==='compose'){view={page:'compose',kind:button.dataset.kind,dept:button.dataset.dept??current?.dept,target:button.dataset.target};setBanner('');render();return}if(act==='reply'){view={page:'compose',kind:'report',dept:current.dept,ref:button.dataset.id};setBanner('');render();return}if(act==='ack'||act==='markread'){const arr=act==='ack'?db.notices:db.reports;const id=button.dataset.id;const record=arr.find(a=>a.id===id);if(record&&(act==='ack'?noticeFor(record):reportFor(record))){const fld=act==='ack'?'ackBy':'seenBy';record[fld]=Array.from(new Set([...(record[fld]||[]),viewer()]));if(!save()){record[fld]=record[fld].filter(v=>v!==viewer());}render()}return}if(act==='getfile'){const id=button.dataset.file;try{const f=await getFile(id);if(!f)throw Error('not found');downloadBlob(f.blob,f.name||'file')}catch{setBanner('فایل پیوست در این مرورگر پیدا نشد. ممکن است داده‌های مرورگر پاک شده باشد.','error');render()}return}if(act==='export'){await exportBackup(button);return}if(act==='import'){app.querySelector('#restoreInput')?.click();return}});
app.addEventListener('input',e=>{if(e.target.id==='loginCode'){const wrap=app.querySelector('#memberNameWrap');if(wrap){const m=loginScope==='department'&&normalizeCode(e.target.value)==='3';wrap.hidden=!m;wrap.querySelector('input').required=m}}});
app.addEventListener('change',async e=>{if(e.target.id==='loginDepartment'){loginDepartment=e.target.value}if(e.target.id==='restoreInput'&&e.target.files?.[0]){await importBackup(e.target.files[0]);e.target.value=''}});
app.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;
if(form.id==='loginForm'){const code=normalizeCode(form.elements.code.value);if(loginScope==='pr'){if(code==='1'){setBanner('پنل رئیس هنوز فعال نشده است.','error');render();return}if(code!=='2'){setBanner('کد روابط عمومی ۲ است.','error');render();return}current={space:'pr',role:2,name:'روابط عمومی'};}else{if(!['1','2','3'].includes(code)){setBanner('کد دبیرخانه باید ۱، ۲ یا ۳ باشد.','error');render();return}const dept=form.elements.department.value;if(!DEPARTMENTS.includes(dept)){setBanner('دبیرخانه نامعتبر است.','error');render();return}const role=Number(code);const name=role===1?(PEOPLE[dept]?.secretary||'دبیر'):role===2?(PEOPLE[dept]?.deputy||'معاون'):form.elements.memberName.value.trim();if(!name){setBanner('نام عضو را وارد کن.','error');render();return}current={space:'department',role,dept,name}}view={page:'home'};setBanner('');render();return}
if(form.id==='composeForm'){const title=form.elements.title.value.trim();const body=form.elements.body.value.trim();if(!title||!body){setBanner('عنوان و متن را وارد کن.','error');render();return}const linksText=form.elements.links.value.trim();const links=linksText?linksText.split(/[\n\r]+/).map(x=>x.trim()).filter(Boolean):[];const invalid=links.find(x=>!cleanUrl(x));if(invalid){setBanner('لینک‌ها باید با http:// یا https:// شروع شوند.','error');render();return}const button=form.querySelector('button[type=submit]');button.disabled=true;button.textContent='در حال ذخیره...';let files=[];try{files=await storeFiles(Array.from(form.elements.attachments.files))}catch{button.disabled=false;button.textContent=view.kind==='notice'?'ارسال ابلاغیه':'ارسال گزارش';setBanner('ذخیره فایل‌ها انجام نشد. فضای مرورگر را بررسی کن یا به‌جای فایل لینک بگذار.','error');const f=form.parentElement.querySelector('.statusline');if(f)f.remove();form.insertAdjacentHTML('beforeend',flash());return}
const isNotice=view.kind==='notice',dept=current.dept||view.dept;const from=current.space==='pr'?'pr':({1:'secretary',2:'deputy',3:'member'})[current.role];const to=current.space==='pr'?(isNotice?'secretary':'president'):(isNotice?(current.role===1?'deputy':'member'):(current.role===1?'pr':current.role===2?'secretary':'deputy'));const object={id:key(),dept:dept||null,from,to,fromName:current.space==='pr'?'روابط عمومی':current.name,title,body,links,files,createdAt:Date.now(),seenBy:[],ackBy:[],ref:form.elements.ref?.value||''};const list=isNotice?db.notices:db.reports;list.push(object);if(!save()){list.pop();button.disabled=false;form.insertAdjacentHTML('beforeend',flash());return}view={page:'home'};setBanner(isNotice?'ابلاغیه ثبت شد و به صندوق مقصد اضافه شد.':'گزارش ثبت شد و به صندوق مقصد اضافه شد.');render();return}});
async function exportBackup(btn){const old=btn.textContent;btn.disabled=true;btn.textContent='در حال آماده‌سازی...';try{const files=await allFiles();const encoded=[];for(const f of files){const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f.blob)});encoded.push({id:f.id,name:f.name,type:f.type,size:f.size,data})}downloadBlob(new Blob([JSON.stringify({format:'dabiran-backup-v1',savedAt:Date.now(),db,files:encoded})],{type:'application/json;charset=utf-8'}),`dabiran-backup-${new Date().toISOString().slice(0,10)}.json`);setBanner('فایل پشتیبان ساخته شد. آن را در جای امن نگهداری کن.');render()}catch{setBanner('ساخت نسخه پشتیبان انجام نشد.','error');btn.disabled=false;btn.textContent=old;render()}}
async function importBackup(file){if(!confirm('بازیابی، اطلاعات فعلی این مرورگر را با فایل پشتیبان جایگزین می‌کند. ادامه می‌دهی؟'))return;try{const data=JSON.parse(await file.text());if(data.format!=='dabiran-backup-v1'||!Array.isArray(data.db?.notices)||!Array.isArray(data.db?.reports)||!Array.isArray(data.files))throw Error('bad-format');const database=await dbFiles();const fileRows=[];for(const f of data.files){const response=await fetch(f.data);const blob=await response.blob();fileRows.push({id:f.id,name:f.name,type:f.type,size:f.size,blob})}await new Promise((resolve,reject)=>{const tx=database.transaction('files','readwrite');const store=tx.objectStore('files');store.clear();fileRows.forEach(f=>store.put(f));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});const old=db;db=data.db;if(!save()){db=old;throw Error('quota')}setBanner('اطلاعات از نسخه پشتیبان بازیابی شدند.');render()}catch{setBanner('فایل پشتیبان معتبر نیست یا فضای کافی وجود ندارد.','error');render()}}
render();
})();
</script>
</body></html>
